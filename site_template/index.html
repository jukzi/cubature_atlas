  });
})();
(function(){

  var iconX='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 1v4H1M15 5h-4V1M11 15v-4h4M1 11h4v4"/></svg>';
  var cur=function(){return document.fullscreenElement||document.webkitFullscreenElement||null;};

    if(!f)return;
    var b=document.createElement('button');

    f.appendChild(b);

  var upd=function(){
    /* The label of figures B, D and E sits outside the box; copy its text in for full screen. */

    btns.forEach(function(p){
      var on=cur()===p[1];

      p[0].title=t(on?'fsExit':'fsBtn');
      p[0].setAttribute('aria-label',p[0].title);});
    /* Canvases take their size from the layout; redraw them for the new size. */
    draw();

  document.addEventListener('fullscreenchange',upd);
  document.addEventListener('webkitfullscreenchange',upd);

/* ---------- state in the URL ----------
   Language, domain, rule source and degree are in the path (de/ prefix, then for example tetra/npi/8/); the other settings
   are in the query string. Both are written back while the user changes things and are read on load.
   The pages behind these paths are small stubs (tools/build_atlas.py) that send the browser to this page with the
   settings in the query string; this page then writes the path again. */
var URLROOT=document.baseURI,URLEN=LANG==='en'?URLROOT:new URL('../',URLROOT).href,URLDE=LANG==='de'?URLROOT:URLROOT+'de/';
var URLTOG=['size','edge','dance','persp','pack','auto','equi','trig'],URLDEF={dom:st.dom,n:st.n,mode:st.mode,fn:st.fn,lang:LANG,exauto:exV.auto,drill:DRILL.on,tog:{}};
URLTOG.forEach(function(k){URLDEF.tog[k]=st[k];});
function urlDefSrc(dom){return DOM[dom].dim===1?'gauss':'found';}
function srcCode(k){return k==='found'?'npi':(k==='out'?'npo':(isF(k)?k.slice(2):k));}
function urlRead(){var q;try{q=new URLSearchParams(location.search);}catch(_){return;}
  var dm=q.get('dom');if(dm&&DOM[dm])st.dom=dm;
  st.src=q.get('src')||urlDefSrc(st.dom);
  var n=parseInt(q.get('n'),10);if(n>=1)st.n=Math.min(n,MX());
  var md=q.get('mode');if(md==='abs'||md==='rel')st.mode=md;
  Array.prototype.forEach.call(document.querySelectorAll('input[name=mode]'),function(i){i.checked=i.value===st.mode;});
  var fn=q.get('fn');if(fn)st.fn=fn;
  var h=q.get('hide');if(h)h.split(',').forEach(function(k){if(k)st.hide[k]=true;});
  URLTOG.forEach(function(k){var v=q.get(k);if(v==='0'||v==='1'){st[k]=v==='1';var b=$('#b-'+k);if(b)b.setAttribute('aria-pressed',st[k]);}});
  var e=q.get('exauto');if(e==='0'||e==='1'){exV.auto=e==='1';$('#b-exauto').setAttribute('aria-pressed',exV.auto);}
  var dr=q.get('drill');if(dr==='0'||dr==='1'){DRILL.on=dr==='1';['#b-sub','#b-subE'].forEach(function(x){var b=$(x);if(b)b.setAttribute('aria-pressed',DRILL.on);});}}
function urlState(){var q=[],root=LANG==='de'?URLDE:URLEN,path=root;
  if(st.dom!==URLDEF.dom||st.src!==urlDefSrc(st.dom)||st.n!==URLDEF.n)path=root+st.dom+'/'+srcCode(st.src)+'/'+st.n+'/';
  if(st.mode!==URLDEF.mode)q.push('mode='+st.mode);
  if(st.fn!==URLDEF.fn)q.push('fn='+encodeURIComponent(st.fn));
  var hd=Object.keys(st.hide).filter(function(k){return st.hide[k];}).sort();if(hd.length)q.push('hide='+hd.map(encodeURIComponent).join(','));
  URLTOG.forEach(function(k){if(st[k]!==URLDEF.tog[k])q.push(k+'='+(st[k]?1:0));});
  if(exV.auto!==URLDEF.exauto)q.push('exauto='+(exV.auto?1:0));
  if(DRILL.on!==URLDEF.drill)q.push('drill='+(DRILL.on?1:0));
  return path+(q.length?'?'+q.join('&'):'');}
var urlLast=null;

document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href^="#"]');if(!a||e.defaultPrevented)return;
  var id=decodeURIComponent(a.getAttribute('href').slice(1)),el=id&&document.getElementById(id);e.preventDefault();if(el)el.scrollIntoView();});
