"viewSub":"Jeder Punkt ist ein Knoten der Regel. Größe und Farbe zeigen das Gewicht. Bei „Größe nach Gewicht“ ist die Fläche eines Kreises (in 3D das Volumen einer Kugel, in 1D der Durchmesser) gleich dem Gewicht; der kleine Punkt markiert den Knoten. Die Ansicht in Winkelkoordinaten (x = sin u, y = sin v, z = sin w auf Intervall, Quadrat und Würfel; normierte baryzentrische Winkel θ = arcsin √λ auf Dreieck und Tetraeder) entzerrt randnahe Knoten und skaliert die Gewichtsgrößen mit der Jacobi-Determinante der Koordinatentransformation. Eine gepunktete Linie führt von einem Knoten außerhalb des Gebiets zu dessen Mitte. Bei 3D-Gebieten dreht Ziehen auf dem Bild die Ansicht.","degree":"Grad n","weight":"Gewicht","rotate":"Drehen","danceBtn":"Animation","subBtn":"Animation","legPoly":"Polynom vom Grad {n} (tanzt)","legInt":"Fläche = Integral des Polynoms","legBar":"Balken: Breite = Gewicht, Höhe = Wert am Knoten","legPts":"{N} Quadraturpunkte (auf der Kurve)","danceNote3":"Ein tanzendes Polynom (bis Grad 10) bestimmt die Farbe der Voronoi-Zellen: grün, wo sein Wert am Knoten positiv ist, rot, wo er negativ ist. Je größer der Betrag, desto kräftiger die Farbe.","danceNote1":"Bei positiven Gewichten füllen die Balken zusammen das Intervall. Bei negativen Gewichten stehen sie mittig auf ihren Knoten und überlappen sich (Balken rot, wenn Gewicht × Wert negativ ist).","danceNote":"Ein tanzendes Polynom vom Grad {n} bestimmt die Höhe der Knoten. Die Säulen stehen auf einer Zerlegung des Gebiets, ihre Grundfläche ist das Gewicht, ihre Höhe der Polynomwert am Knoten (grün positiv, rot negativ). Ziehen dreht die Ansicht, anfangs sieht man von oben auf das Gebiet.","sizeW":"Größe nach Gewicht","edge":"Gebietsrand","cellsBtn":"Voronoi-Zellen","perspBtn":"Perspektive","equiBtn":"Regulär","packBtn":"Kugelpackung","plist":"Punkteliste mit Gewichten","copyList":"Liste kopieren","copyCode":"Code kopieren","copied":"Kopiert.","copyFail":"Text markiert, bitte mit Strg+C kopieren.","nodes":"Knoten","abzv":"Abzählwert","error":"Fehler","wsum":"Σ Gewichte","ovH":"Übersicht: ","colN":"Grad","colFound":"PI numerisch","fmlBtn":"Formeln anzeigen","methBtn":"Wie diese Regel berechnet wurde","optPosBtn":"Minimal mit positiven Gewichten","optPosStar":"Minimal unter den Regeln mit positiven Gewichten: bewiesen in der Dokumentation (Abschnitt untere Schranke), obwohl N über L liegt. L gilt für beliebige Gewichte und wird hier nur mit einem negativen Gewicht erreicht.","optBtn":"Optimale Regel","optStar":"Optimal: N ist gleich der bewiesenen unteren Schranke L (Spalte L), es gibt also keine Regel mit weniger Knoten.","oqBtn":"Offene Frage","oqTri9":"Offene Frage (Dreieck, Grad 9): Ist N = 19 minimal? Bewiesen ist die untere Schranke 17 (Möller).\n\n17 und 18 Knoten: je 600 Zufalls- und Kugelpackungsstarts, mit Knoten innen, mit Knoten außerhalb und mit beliebigen Gewichten, fanden keine Regel; dieselbe Suche findet die 19-Knoten-Regel in höchstens 200 Starts. Bei 18 Knoten schiebt der Löser einen Knoten weit nach außen und sein Gewicht gegen 0, effektiv bleiben 17 Knoten.\n\nDer nächste Schritt der Momentenmethode entscheidet die Frage nicht: Mit freien Momenten vom Grad 10 lässt sich die diskrete Gram-Matrix der orthonormalen Polynome vom Grad 5 positiv semidefinit mit Rang 2 machen (moment_relaxation.py), 17 Knoten sind auf dieser Stufe also nicht ausgeschlossen. Ein Beweis braucht die Momente vom Grad 11 und 12 (flache Erweiterung), wie beim Würfel bei Grad 6.","oqCube6":"Offene Frage (Würfel, Grad 6): Ist N_PI = 22 minimal, und ist N_PO = 21 minimal? Bewiesen ist als untere Schranke nur dim P3 = 20.\n\n21 Knoten im Würfel: Tausende Zufallsstarts fanden keine Regel. Alle 12 gefundenen verschiedenen Regeln mit 21 Knoten und positiven Gewichten (bis auf Symmetrie) haben Knoten außerhalb des Würfels; die nächstgelegene reicht bis max|x| = 1,272 (die hier gezeigte PO-Regel).\n\n20 Knoten, beliebig gelegen: Eine solche Regel gibt es genau dann, wenn die Momentenmatrix M(3) eine flache Erweiterung M(4) hat (Curto–Fialkow). Das ist ein System aus 75 quadratischen Gleichungen in den 36 Momenten vom Grad 7. Numerisch hat es keine reelle oder komplexe Lösung, aber es gibt kein algebraisches Zertifikat vom Grad 4 oder kleiner; ein Beweis braucht also aufwendigere Computeralgebra (Grad 6 oder mehr).\n\nFür die Kreisscheibe haben Easwaran, Fialkow und Petrovic (2006) den entsprechenden Fall mit 10 Knoten bewiesen; der nächste Fall ist dort ebenfalls offen.","colAbz":"Abzählwert","colLow":"untere Schr.","colGauss":"Gauß-Produkt","colLit":"Literatur","colOut":"PO numerisch","legFound":"PI: numerische Suche (diese Seite)","legAbz":"Z: Abzählwert","legLow":"L: untere Schranke","legGauss":"G: Gauß-Produkt","legXg":"XG: Xiao–Gimbutas","legSym":"sym: Literatur, voll symmetrisch","legLit":"Lit: kleinster Literaturwert","legOut":"PO: Knoten auch außen erlaubt","f1":"Grad 20","f1s":"Knoten","f2":"Gauß-Produkt","f2s":"bei Grad 20","f3":"Ersparnis","f3s":"gegenüber dem Gauß-Produkt bei Grad 20","f4":"Abstand zum Abzählwert","f4s":"Grad 1 bis 20, größte Differenz","chartLbl":"Knotenzahl über dem Grad","isoTip":"Isolierte Lösung: Das Momentensystem ist quadratisch (so viele Gleichungen wie Unbekannte, d + 1 pro Knoten) und seine Jacobi-Matrix an dieser Regel ist regulär; die Regel hat keinen freien Parameter und ist lokal eindeutig.","isoBtn":"Isolierte Lösung","smileBtn":"Wenigste Knoten in dieser Zeile, höchstens Z","smileTip":"Die beste Regel in dieser Zeile hat höchstens so viele Knoten wie der Zählwert Z.","asymBtn":"Keine symmetrische Regel mit genau Z Knoten","asymTri":"Keine Regel, die unter der Drehgruppe des Dreiecks symmetrisch ist (C3, auch S3), kann genau Z Knoten haben: Ihre Knoten bilden Bahnen aus 3 (oder 6) Knoten und höchstens den Mittelpunkt, die Knotenzahl ist also 0 oder 1 modulo 3, Z ist aber 2 modulo 3. Eine Regel mit Z Knoten müsste asymmetrisch sein.","asymSq":"Keine Regel, die unter der Drehgruppe des Quadrats symmetrisch ist (C4, auch D4), kann genau Z Knoten haben: Ihre Knoten bilden Bahnen aus 4 (oder 8) Knoten und höchstens den Mittelpunkt, die Knotenzahl ist also 0 oder 1 modulo 4, Z ist aber 2 oder 3 modulo 4. Eine Regel mit Z Knoten müsste asymmetrisch sein.","trophyBtn":"Wenigste Knoten in dieser Zeile","notes":{"interval":"Im Intervall ist die Gauß-Legendre-Formel optimal: Abzählwert, untere Schranke und Gauß-Produkt stimmen überein, mehr als ⌈(n+1)/2⌉ Knoten spart keine Regel ein.","triangle":"Die Regeln liegen höchstens 2 Knoten über dem Abzählwert und sind nie größer als die Regeln von Xiao und Gimbutas. Bei den Graden 3, 7, 10, 15, 17 und 18 bis 20 liegen sie darunter. Der Vergleich ist nur bedingt fair, denn die Literaturregeln sind voll symmetrisch. Bei den ungeraden Graden 3, 5 und 7 erreichen die Regeln die untere Schranke von Möller (4, 7 und 12 Knoten), sie sind also minimal.","square":"Bei den ungeraden Graden 9 und 11 erreichen die Regeln die Möller-Schranke (17 und 24 Knoten). Gegenüber den kleinsten bekannten voll symmetrischen Regeln (zum Beispiel 57 Knoten bei Grad 17) kommen die zentralsymmetrischen Regeln hier mit weniger Knoten aus (54). Ab Grad 21 liegen die Regeln bei geraden Graden höchstens 1 Knoten über dem Abzählwert, bei ungeraden Graden darunter.","tetra":"Der Abzählwert ist hier eine gute Prognose: Niedrige und mittlere Grade liegen dicht daran, während höhere Grade fortlaufend durch symmetriereduzierte (A4/S4-) und Schalen-Suchen verbessert werden. Die voll symmetrischen Regeln der Literatur sind bei niedrigen Graden größer (Grad 9: 59, Grad 10: 81). Bei Grad 3 ist die 6-Knoten-Regel unter den Regeln mit positiven Gewichten minimal (Beweis in der Dokumentation; 5 Knoten brauchen ein negatives Gewicht). Bei Grad 5 fand die Suche keine Regel mit 13 Knoten (980 Starts, Knoten außerhalb erlaubt), und 12 Knoten sind für beliebige reelle Gewichte exakt ausgeschlossen (Dokumentation, tetra5_bound.py); die Schranke ist also 13, die Lücke zur 14-Knoten-Regel beträgt 1. Bei Grad 7 wurde keine Regel mit 30 inneren Knoten gefunden (224 Starts; mit Knoten außerhalb gibt es 30).","cube":"Der Würfel hat die größte Lücke zwischen Gauß-Produkt und den kleinsten bekannten Regeln: Ab Grad 10 braucht das Produkt mehr als dreimal so viele Knoten. Gegenüber voll symmetrischen Regeln (Grad 9: 58, Grad 15: 199) sind die zentralsymmetrischen Regeln hier kleiner (48 und 186). Bei den Graden 3, 5 und 7 erreichen die Regeln Möllers Schranke für zentralsymmetrische Gebiete (6, 13 und 26 Knoten), sie sind also minimal."},"exH":"Numerische Integration in Aktion","exSub":"Die Regeln integrieren Funktionen, die kein Polynom sind. Gezeigt ist der relative Fehler gegen den exakten Wert, über dem Grad. Die orange Linie ist die Rechengenauigkeit; darunter ist der Fehler nur noch Rundungsrauschen. Wurzel und Logarithmus sind so verschoben, dass sie im ganzen Gebiet endlich bleiben, die Verzweigungsstelle liegt knapp außerhalb. Der Fehler braucht wegen der Spannweite von 16 Größenordnungen eine logarithmische Skala.","fnSqrt":"Wurzel","fnLog":"Logarithmus","fnSin":"Sinus","fnRunge":"Runge-Spitze","fnBanana":"Bananenfunktion","fnBell":"Glockenkurve","fnCos":"1 + Kosinus","fnAckley":"Ackley (geglättet)","fnGosc":"Genz: oszillierend","fnGprod":"Genz: Produkt-Peak","fnGcorner":"Genz: Ecken-Peak","fnGgauss":"Genz: Gauß-Glocke","figA":"Abbildung A: Quadraturpunkte","figB":"Abbildung B: Knotenzahlen","figC":"Abbildung C: Beispielapproximation","figD":"Abbildung D: Beispielfehler über Grad","figE":"Abbildung E: Beispielfehler über Knoten","figFor":"für","srcFound":"Numerische Suche PI","srcLitB":"Literatur","tabW":"Tabelle","trophy":"Wenigste Knoten in dieser Zeile (bei Gleichstand zuerst Literatur, dann N_PI, dann N_PO)","tab1":"Knotenzahl je Grad","nOdd":"n ungerade","nEven":"n gerade","tab2":"Beweise","srcGaussL":"Gauß–Legendre","srcOutB":"Numerische Suche PO","srcInfoOut":"PO: positive Gewichte, die Knoten dürfen auch außerhalb des Gebiets liegen. Gefunden von der numerischen Suche dieser Seite; wo die Suche nichts Kleineres als PI fand, ist es die PI-Regel.","srcInfoOutNone":"Für Grad {n} wurde noch keine PO-Suche ausgeführt.","symTip":"Voll symmetrische Regel (Oh/Td); der Intervall-Beweis nutzt das symmetriereduzierte System","srcSymC":"Voll symmetrische Regel (Oh/Td), noch nicht bewiesen","srcNcB":"Äquidistant","srcCcB":"Clenshaw–Curtis","srcLobB":"Gauß–Lobatto","srcInfo_nc":"Interpolatorische Regel (Newton–Cotes) mit {N} gleichmäßig verteilten Knoten einschließlich der Randpunkte: Das Interpolationspolynom wird exakt integriert.","srcInfo_cc":"Interpolatorische Regel mit {N} Tschebyscheff-Extrema (Clenshaw–Curtis), Randpunkte eingeschlossen. Gewichte immer positiv.","srcInfo_lob":"Gauß–Lobatto mit {N} Knoten: beide Randpunkte plus die Nullstellen von P′, exakt bis Grad 2N−3.","srcInfoNeg":"{k} Gewichte sind negativ (orange).","srcGaussB":"Gauß-Produkt","srcInfoFound":"Kleinste PI-Regel aus der numerischen Suche dieser Seite.","srcInfoLit":"Literaturregel: {s}, Regel für Grad {d}.","srcInfoLitCount":"Literaturwert: {c} Knoten. Der Atlas speichert dazu keine Punkte, deshalb werden keine Knoten gezeigt.","srcInfoLitNone":"Für Grad {n} gibt es keine Literaturregel.","srcInfoGauss":"Gauß-Produkt mit {m} Punkten je Richtung (exakt bis Grad {e}).","fnSinc":"Sinc-Welle","fnZsin":"|sin 2z|² (komplex)","fnRez2":"Re exp(z²) (komplex)","fnPole":"Re 1/(z−z₀) (Pol nahe am Gebiet)","exSelH":"Beispielfunktion","litLbl":"Regeln aus der Literatur (voll symmetrisch)","srcTipS":"eigene Suche, Momentengleichungen nachgerechnet, noch nicht bewiesen","srcSearch":"eigene Suche, Momentengleichungen nachgerechnet; Intervall-Beweis noch nicht berechnet","srcTip":"aus der Literatur, hier mit Intervallarithmetik bewiesen","srcNote":"Einträge in N<sub>PI<\/sub> stammen aus eigener Suche und sind wie die übrigen Regeln in Intervallarithmetik bewiesen. Ein Strich in N<sub>PI<\/sub> heißt, dass die Suche des Atlas diesen Grad noch nicht erfasst hat; die Zeile zeigt dann nur die veröffentlichten Regeln. ‡ Symmetriereduzierte Regel (etwa Oh, Td, C4, A4 oder S4), gefunden über Orbit-Parameter. Ihr Intervall-Beweis nutzt das symmetriereduzierte System (Orbit-Parameter und Orbit-Gewichte als Unbekannte, Momente der invarianten Polynome als Gleichungen) und beweist eine exakte symmetrische Regel in der Nähe. ★ markiert Werte mit N = L: diese Regeln sind optimal. ☆ markiert Regeln, die unter den Regeln mit positiven Gewichten bewiesen minimal sind.","srcLit":"Literaturregel (Diallo–Worku), Momentengleichungen nachgerechnet, hier mit Intervallarithmetik bewiesen","srcGauss":"Gauß–Jacobi-Produkt, exakt nach Konstruktion","srcNoCertC":"einfache Regel, exakt nach Konstruktion","exact":"exakter Wert","exactA":"analytisch","exactR":"Referenz (Gauß, hohe Ordnung)","Q":"Regelwert Q","absErr":"absoluter Fehler","relErr":"relativer Fehler","floorNote":"unter 1e-16: Rundungsgrenze","noiseLbl":"Rechengenauigkeit (Rundung, 64 bit)","exNH":"Fehler über der Knotenzahl","exNnote":"Gleiche Knotenzahl, kleinerer Fehler heißt bessere Regel. Kreise: die Regeln dieser Seite, Rauten: voll symmetrische Regeln aus der Literatur mit echten Knoten (Quadrat und Würfel Diallo–Worku, Dreieck Witherden–Vincent, Tetraeder Jaśkowiec–Sukumar), gestrichelt: Gauß-Produkt. Welche Regel bei gleicher Knotenzahl vorn liegt, hängt von der Funktion ab: Warum, steht in der Dokumentation (Abschnitt „Warum schlägt das Gauß-Produkt …“). Der markierte Kreis ist der gewählte Grad.","exNnoteI":"Im Intervall ist das Gauß-Produkt die gefundene Regel; ein Vergleich entfällt.","capSurf":"Funktionsfläche über dem Gebiet; die Säulen (grün: Funktionswert positiv, rot: negativ) stehen auf einer Zerlegung des Gebiets (Voronoi-artig, jede Zelle enthält einen Knoten), die Grundfläche einer Säule ist gleich dem Gewicht, alle Grundflächen zusammen ergeben das Gebiet, die Höhe ist der Funktionswert. Ziehen dreht die Ansicht.","capCloud":"Wolke aus Stichprobenpunkten im Gebiet, gefärbt nach Funktionswert, mit den Voronoi-Zellen der Knoten (grün: Funktionswert positiv, rot: negativ) und den Knoten in Dunkel. Ziehen dreht die Ansicht.","curve":"Funktionskurve mit Balken: Breite = Gewicht, Höhe = Funktionswert am Knoten. Die Summe der Balkenflächen ist die Näherung des Integrals.","shiftTxt":"s = x₁+…+x_d + d, d = Dimension (Boxen);  s = x₁+…+x_d (Simplizes)","certH":"Nachweis: Regeln liegen in der Nähe exakter Lösungen","certSub":"Eine Regel mit Rundungsfehler 10<sup>−15<\/sup> im Moment ist noch keine exakte Regel. Jede Regel des Atlas hat deshalb einen Intervall-Beweis (Krawczyk-Test mit Intervallarithmetik, alle Rundungsfehler berücksichtigt, Programm tools/verify_rigorous.py): er beweist mathematisch, dass im angegebenen Abstand eine exakte Regel liegt und dass sie die angegebene Qualität hat (positive Gewichte, Knoten innen bzw. außen). Die Tabelle zeigt außerdem eine numerische Newton-Kantorovich-Prüfung in Gleitkomma mit geschätzter Lipschitz-Konstante. Diese Prüfung ist nur ein Indiz, kein Beweis.","certCols":["Grad","Knoten","Intervall-Beweis","Gleichungen × Unbekannte","max. Restfehler","σ_min(J)","numerisch: h = L·η/σ²","numerisch: Radius 2η","numerisch: im Gebiet"],"certOk":"bestätigt","certBad":"offen","inOk":"ja","inEdge":"Randknoten","docH":"Dokumentation","docSub":"Was die Zahlen bedeuten, wie sie entstehen und wie sie geprüft sind.","codeH":"Quellcode","codeSub":"Alles, was zur Berechnung und Prüfung der Werte nötig ist, steht hier und läuft mit numpy und scipy.","code4":"kubatur.py: Suche Dreieck/Tetraeder mit numerischer Prüfung","code5":"dom.py, cs.py, fj.py: Basis und Löser (Quadrat, Dreieck, Tetraeder)","code6":"seed_sq.py, seed_cs.py: Quadrat, Start aus niedrigerem Grad","code7":"sqelim.py: Quadrat, Knotenreduktion (PI und PO)","code8":"seed_tri2.py, free_search.py: Dreieck/Tetraeder, Start aus Vorgrad, PO-Suche","code9":"symsearch.py: Orbit-Suche (Dreieck, Tetraeder)","code10":"cubature_search.py, verify_rules.py, cube_cert.py: Würfel, symmetrische Suche und numerische Prüfung","code1":"counts.py: Abzählwert, untere Schranken, Gauß-Produkt","code11":"triangle_moeller.py: Dreieck, exakte Möller-Schranke für ungerade Grade","code12":"moeller_bound.py: untere Schranken für ungerade Grade in 2D und 3D (Strukturmatrizen, exakt modulo einer Primzahl)","code13":"tetra3_positive.py: Tetraeder Grad 3, keine 5-Knoten-Regel mit positiven Gewichten (exakt)","code14":"moment_relaxation.py: Momenten-Relaxation für ungerade Grade (numerischer Test)","code15":"tetra5_bound.py: Tetraeder Grad 5, keine 12-Knoten-Regel für beliebige Gewichte (exakt)","code2":"cubature_atlas.py: Basis, Suche, numerische Prüfung","code3":"demo.py: Regel suchen, numerisch prüfen, integrieren","litH":"Literatur und Formelsammlungen","foot":"Diese Seite wurde von einer KI erstellt: Claude (Modell claude-sonnet-5-5) von Anthropic hat Suche, Rechnung, Prüfung, Text und Code erzeugt, im Auftrag und unter Anleitung von Jörg Kubitz. Fehler sind möglich; die Intervall-Beweise und der Quellcode erlauben die Nachprüfung. Alle Regeln sind numerisch berechnet und mit Intervallarithmetik bewiesen; die Würfelregeln ab Grad 21 stammen aus einer Suche mit Symmetriereduktion. Gauß-Legendre im Intervall und die Referenzwerte der Beispiele sind analytisch oder in hoher Ordnung bestimmt.","certSumTpl":"{dom}: {ok} von {tot} Regeln bestehen die numerische Prüfung (h ≤ ½, Gleitkomma, kein Beweis), bei {ins} davon bleibt der Ball um die Regel im Gebiet mit positiven Gewichten. Der Beweis ist der Intervall-Beweis in der dritten Spalte (Qualität, Abstand und Modus unter ⓘ); er entscheidet auch Regeln mit Knoten auf dem Rand des Gebiets.","title":"Kubaturatlas","titleHtml":"Kubatur<em>atlas<\/em>","pageTitle":"Kubaturatlas – kleinste bekannte Quadratur- und Kubaturformeln mit positiven Gewichten","metaDesc":"Kleinste bekannte Quadratur- und Kubaturformeln mit wenigen Knoten und positiven Gewichten auf Intervall, Dreieck, Quadrat, Tetraeder und Würfel, jede mit Beweis in Intervallarithmetik, und Quellcode.","linkRepo":"GitHub-Repository","linkData":"alle Daten (JSON)","linkZip":"alle Regeln (ZIP)","famH":"Regelfamilien","famDir":"Verzeichnis","famRules":"Regeln","famRoleOwn":"Eigene Familie, im Betrachter, in der Tabelle und in den Diagrammen auswählbar.","srcInfoFam":"Familie {f}: Regel für Grad {d} mit {N} Knoten ({q}).","srcInfoFamNone":"Familie {f} hat keine Regel für Grad {n}.","rpBack":"Zurück zum Atlas","rpFamily":"Familie","rpDomain":"Gebiet","rpDegree":"Grad","rpPoints":"Knotenzahl","rpQuality":"Qualität","rpResidual":"Max. Momentenfehler (Build-Prüfung)","rpMinW":"Kleinstes Gewicht","rpMargin":"Abstand zum Gebietsrand (negativ = außen)","rpCert":"Numerische Newton-Kantorovich-Prüfung (Gleitkomma, kein Beweis)","rpOrigin":"Herkunft","rpDownload":"JSON herunterladen","rpCite":"Zitieren als","rpNodes":"Knoten und Gewichte","rpBest":"Beste bekannte Regel für dieses Gebiet und diesen Grad","rpSuper":"Nicht die beste bekannte Regel; beste bekannte:","rpYes":"ja","rpNo":"nein","rpIndex":"Alle Regeln","dom_interval":"Intervall","dom_triangle":"Dreieck","dom_square":"Quadrat","dom_tetra":"Tetraeder","dom_cube":"Würfel","linkLicense":"Lizenz: CC BY 4.0","rpLicLit":"Aus der zitierten Veröffentlichung zum Vergleich übernommen; nicht von der CC-BY-4.0-Lizenz des Atlas erfasst, es gelten die ursprünglichen Bedingungen.","linkDoi":"DOI 10.5281/zenodo.24037245","compBtn":"Zusammengesetzte Regeln","exNnoteC":"Nur die minimalen PI-Regeln des Atlas und das Gauß-Produkt, jeweils ungeteilt und als zusammengesetzte Regel: Das Gebiet wird in k Teile je Richtung zerlegt (k^dim kongruente Zellen; Tetraeder durch rote Verfeinerung), die Regel wird auf jede Zelle abgebildet und die Ergebnisse werden addiert. Die x-Achse zählt die Funktionsauswertungen, also Knoten × Zellen; Kurven, die über den rechten Rand hinausgehen, sind dort abgeschnitten. Die Rechengenauigkeit ist die der ungeteilten Regel. Bei gleicher Knotenzahl liegt meist die ungeteilte Regel höheren Grades vorn; zusammengesetzte Regeln gewinnen vor allem bei Funktionen mit nahen Singularitäten wie der Runge-Funktion.","compLbl":"{s}, {c} Zellen","evalsAx":"Funktionsauswertungen (Knoten × Zellen)","fsBtn":"Vollbild","fsExit":"Vollbild beenden (Esc)","zmReset":"Zoom zurücksetzen","rpIv":"Intervall-Beweis","rpIvOk":"bewiesen: eine exakte Regel der Qualität {q} liegt höchstens {d} von den gespeicherten Zahlen entfernt ({m})","rpIvNo":"nicht bewiesen","rpIvNone":"noch nicht geprüft","ivOk":"bewiesen","ivSym":"symmetriereduzierte Gleichungen, Gruppe der Ordnung {g}","ivFull":"Gleichungen in allen Unbekannten","ivSumTpl":"Intervall-Beweis: Für {iv} der {all} Grade ist bewiesen, dass die Regel der Tabelle nahe einer exakten Regel ihrer Qualität liegt.","ivBtn":"Details des Intervall-Beweises","trigTag1":"x = sin u,  u ∈ [−π/2, π/2]","trigTag2":"x = sin u, y = sin v,  u, v ∈ [−π/2, π/2]","trigTag3":"x = sin u, y = sin v, z = sin w,  u, v, w ∈ [−π/2, π/2]","trigTagS":"θ = arcsin √λ,  u = θ / Σθ","trigBtn":"Winkelkoordinaten","tipNode":"Knoten #{i}","tipOrbit":"Orbit: {k}","tipOut":"außerhalb","tipPin":"fixiert","loadingPts":"Lade Knoten…","loadPtsErr":"Knotendaten konnten nicht geladen werden – zum Wiederholen klicken.","dlList":"Herunterladen","themeDark":"Zum dunklen Design wechseln","themeLight":"Zum hellen Design wechseln"}},"doc":{"en":"<div><h3 id=\"e-task\">Task<\/h3><p>A cubature rule is a sum <span class=\"m\">Σ wᵢ f(xᵢ)<\/span> that reproduces the integral of f over the domain exactly for all polynomials of total degree ≤ n. The goal is the smallest number of nodes N. Additionally all weights are positive and all nodes lie in the closed domain. Surveys: <a class=\"cite\" href=\"#r10\">[10]<\/a><a class=\"cite\" href=\"#r11\">[11]<\/a>.<\/p><h3>Reference domains<\/h3><ul><li>Interval [−1,1], length 2<\/li><li>Square [−1,1]², area 2² = 4<\/li><li>Triangle (0,0), (1,0), (0,1), area ½<\/li><li>Tetrahedron (0,0,0), (1,0,0), (0,1,0), (0,0,1), volume ⅙<\/li><li>Cube [−1,1]³, volume 8<\/li><\/ul><h3 id=\"e-not\">Notation<\/h3><p>n: degree, d: dimension, N: number of nodes. <b>PI<\/b> (positive, inner): positive weights, all nodes in the closed domain (boundary points count). This is the condition of the atlas. <b>PO<\/b> (positive, outer): positive weights, nodes may also lie outside.<\/p><p>Columns: N<sub>PI<\/sub> smallest known PI rule, Z counting value (for square and cube the smaller of the general and the symmetric counting value), Δ = N<sub>PI<\/sub> − Z, L lower bound, N<sub>G<\/sub> Gauss product, N<sub>Lit<\/sub> smallest literature value (Xiao–Gimbutas or symmetric rules), N<sub>PO<\/sub> smallest known PO rule.<\/p><h3 id=\"e-found\">Column N<sub>PI<\/sub> (smallest known PI rule)<\/h3><p>Number of nodes of the smallest rule this page knows for the degree. It comes from a numerical search of its own (section Search method) and is checked against all monomials, checked numerically (Newton–Kantorovich) and proven with interval arithmetic. Every rule is also a valid rule for all smaller degrees.<\/p><h3 id=\"e-delta\">Column Δ<\/h3><p>Difference “found” minus counting value. Negative values mean the rule is smaller than the rule of thumb.<\/p><h3 id=\"e-abz\">Counting value<\/h3><p>The moment equations form a nonlinear system. Counting equations and unknowns suggests that a rule needs about this many nodes:<\/p><div class=\"formula\">Z(n, d) = ⌈ M(n, d) / (d + 1) ⌉<br>M(n, d) = C(n+d, d) = (n+d)! / (n!·d!)<\/div><p>Here n is the degree, d the dimension (interval 1, triangle and square 2, tetrahedron and cube 3), M(n,d) the number of monomials of degree ≤ n (the dimension of the polynomial space) and Z(n,d) the counting value. Each node brings d coordinates and one weight, i.e. d+1 unknowns. Example, triangle, n = 20: M = C(22,2) = 231, Z = ⌈231/3⌉ = 77. One more degree adds exactly the monomials of exact degree n+1, M(n+1,d) − M(n,d) = C(n+d, d−1), so Z grows per degree by about<\/p><div class=\"formula\">Z(n+1, d) − Z(n, d) ≈ C(n+d, d−1) / (d + 1)<\/div><p>Written out:<\/p><div class=\"formula\">d = 2: Z(n) = ⌈ (n+1)(n+2) / 6 ⌉<br>Z(n+1) − Z(n) ∈ { ⌊(n+2)/3⌋, ⌈(n+2)/3⌉ }<br><br>d = 3: Z(n) = ⌈ (n+1)(n+2)(n+3) / 24 ⌉<br>Z(n+1) − Z(n) ∈ { ⌊(n+2)(n+3)/8⌋, ⌈(n+2)(n+3)/8⌉ }<\/div><p>So up to rounding the increase per degree is (n+2)/3 for the triangle and (n+2)(n+3)/8 for the tetrahedron. For large n, Z ≈ nᵈ / (d!·(d+1)) while the Gauss product grows like (n/2)ᵈ, so the ratio is ≈ 2ᵈ/(d!·(d+1)): 2/3 for triangle and square (4/(2·3)), 1/3 for tetrahedron and cube (8/(6·4)). The value is a rule of thumb and not a bound: rules can lie below or above.<\/p><h3 id=\"e-zsym\">Square and cube: symmetric counting value<\/h3><p>Square and cube are centrally symmetric. If a rule is symmetric under x ↦ −x (equal weights at x and −x), every monomial of odd degree is integrated exactly by symmetry, because integral and sum both vanish. Only the monomials of even degree remain as equations, and a node pair ±x brings d+1 unknowns for 2 nodes:<\/p><div class=\"formula\">E(n, d) = Σ<sub>j even, j ≤ n<\/sub> C(j+d−1, d−1)<br>Z<sub>sym<\/sub>(n, d) = ⌈ 2·E(n, d) / (d + 1) ⌉<\/div><p>For square and cube the column Z shows the smaller of both values:<\/p><div class=\"formula\">Z = min( ⌈ M(n, d) / (d + 1) ⌉, Z<sub>sym<\/sub>(n, d) )<\/div><p>Which one is smaller depends only on the parity of n. Split the monomials of degree ≤ n into E of even and O of odd degree, M = E + O. Then Z<sub>sym<\/sub> &lt; Z exactly when O &gt; E. The layer of exact degree j has C(j+d−1, d−1) monomials, which grows with j, so the top layer decides: for odd n there are more odd monomials and the symmetric value is smaller; for even n there are more even monomials, a symmetric rule is automatically exact for degree n+1 as well and pays for that with extra nodes, so the general value is smaller. Hence Z<sub>sym<\/sub>(2k) = Z<sub>sym<\/sub>(2k+1) and<\/p><div class=\"formula\">Z(2k) ≤ Z<sub>sym<\/sub>(2k+1) ≤ Z(2k+1)  (general Z)<\/div><p>Written out for odd n:<\/p><div class=\"formula\">d = 2: Z(n) = ⌈ (n+1)² / 6 ⌉<br>d = 3: Z(n) = ⌈ (n+1)(n+3)(2n+1) / 48 ⌉<\/div><p>This lowers the counting value at odd degrees by about (n+1)/6 for the square and (n+1)(n+3)/16 for the cube. Example cube, n = 9: E = 1+6+15+28+45 = 95, Z = 48 instead of 55; the found rule has 48 nodes and is centrally symmetric.<\/p><p>Triangle and tetrahedron have no centre of symmetry: the map x ↦ −x (about the centroid) takes them to a different set, so no rule can have this symmetry, odd moments do not vanish, and the general counting value applies. In the interval both values agree for odd n, Gauss rules are symmetric and optimal at the same time.<\/p><\/div>\n<div><h3 id=\"e-low\">Lower bound<\/h3><ul><li>Degree 2k: at least dim P<sub>k<\/sub> = C(k+d,d) nodes, for any domain <a class=\"cite\" href=\"#r3\">[3]<\/a>. For even degrees no sharper general bound is known <a class=\"cite\" href=\"#r11\">[11]<\/a><a class=\"cite\" href=\"#r19\">[19]<\/a>, and at small degrees none is possible: the bound is attained on the triangle at degrees 2, 4, 6 (3, 6, 10 nodes; at degree 6 only by the PO rule), on the square at degrees 2 to 8 (3, 6, 10, 15 nodes; at degree 8 by the PO rule), on the tetrahedron and the cube at degrees 2 and 4 (4 and 10 nodes; tetrahedron degree 4 by the PO rule).<\/li><li>Odd degrees 2k−1 on the square: the sharper Möller bound dim P<sub>k−1<\/sub> + ⌊k/2⌋ <a class=\"cite\" href=\"#r3\">[3]<\/a>.<\/li><li>Odd degrees 2k−1 on the triangle: the same value dim P<sub>k−1<\/sub> + ⌊k/2⌋. It follows from Möller's general bound <a class=\"cite\" href=\"#r4\">[4]<\/a>, which needs no symmetry, in the form given by Xu <a class=\"cite\" href=\"#r27\">[27]<\/a>: N ≥ dim P<sub>k−1<\/sub> + ½·rank(A<sub>k−1,1<\/sub>A<sub>k−1,2<\/sub><sup>T<\/sup> − A<sub>k−1,2<\/sub>A<sub>k−1,1<\/sub><sup>T<\/sup>). The A<sub>k−1,i<\/sub> are the matrices of the three-term relation x<sub>i<\/sub>P<sub>k−1<\/sub> = A<sub>k−1,i<\/sub>P<sub>k<\/sub> + … of the orthonormal polynomials (Dubiner basis) <a class=\"cite\" href=\"#r9\">[9]<\/a>. The matrix in the bracket is skew-symmetric of size k, so its rank is even and at most 2⌊k/2⌋. The program triangle_moeller.py computes the rank exactly with fractions: for every odd degree from 3 to 29 it is maximal; for the odd degrees from 31 to 49 moeller_bound.py gives the same result (rank modulo a prime, see the tetrahedron below). Consequences: the rules with 4, 7 and 12 nodes at degrees 3, 5 and 7 are minimal, and since the rank is never 0 there is no Gauss rule with only dim P<sub>k−1<\/sub> nodes on the triangle (Mysovskikh's condition fails). The bound holds for any real weights and nodes anywhere; a short proof is in the header of moeller_bound.py.<\/li><li>Odd degrees 2k+1 on the tetrahedron: the same argument in three variables. With the three matrices M<sub>ij<\/sub> = A<sub>k,i<\/sub>A<sub>k,j<\/sub><sup>T<\/sup> − A<sub>k,j<\/sub>A<sub>k,i<\/sub><sup>T<\/sup> it gives N ≥ dim P<sub>k<\/sub> + ρ with ρ ≥ ⌈rank M<sub>ij<\/sub>/2⌉ for every pair and ρ ≥ ⌈rank(M<sub>12<\/sub>|M<sub>13<\/sub>|M<sub>23<\/sub>)/3⌉. The program moeller_bound.py computes the ranks exactly modulo a prime; a rank modulo a prime is never larger than the rational rank, so the values are proven. For all odd degrees from 3 to 39 the pair ranks are dim V<sub>k<\/sub> − ⌈(k+1)/2⌉ (dim V<sub>k<\/sub> = (k+1)(k+2)/2), which gives L = dim P<sub>k<\/sub> + (dim V<sub>k<\/sub> − ⌈(k+1)/2⌉)/2, e.g. 5, 12, 24, 41 nodes at degrees 3, 5, 7, 9 (before: 4, 10, 20, 35).<\/li><li>Odd degrees 2k+1 on the cube: Möller's bound for centrally symmetric integrals <a class=\"cite\" href=\"#r4\">[4]<\/a>, N ≥ 2·dim P<sub>k<\/sub><sup>odd<\/sup> for odd k and N ≥ 2·dim P<sub>k<\/sub><sup>even<\/sup> − 1 for even k, where P<sub>k<\/sub><sup>even<\/sup>, P<sub>k<\/sub><sup>odd<\/sup> are the polynomials of degree ≤ k made of monomials of even or odd degree. In the explicit form of Hinrichs and Novak <a class=\"cite\" href=\"#r15\">[15]<\/a> this is 2d, d<sup>2<\/sup>+d+1 and (d<sup>3<\/sup>+3d<sup>2<\/sup>+8d)/3 at degrees 3, 5, 7. For the cube it is larger than the bound from the structural matrices (which gives the tetrahedron values). Consequence: the cube rules with 6, 13 and 26 nodes at degrees 3, 5 and 7 are minimal.<\/li><li>Positive weights, tetrahedron degree 3: at least 6 nodes (the general bound 5 is attained only with a negative weight). With 5 nodes the discrete Gram matrix K of the orthogonal polynomials of degree 2 has rank 1, K = s·gg<sup>T<\/sup>. The equations s·(a<sub>i<\/sub> × a<sub>j<\/sub>) = m<sub>ij<\/sub> with a<sub>i<\/sub> = A<sub>1,i<\/sub>g have a real solution only if s·c<sub>12<\/sub>c<sub>13<\/sub>c<sub>23<\/sub> &gt; 0, where m<sub>ij<\/sub> = c<sub>ij<\/sub>(u<sub>i<\/sub> × u<sub>j<\/sub>) for fixed vectors u<sub>i<\/sub>. The exact values give c<sub>12<\/sub>c<sub>13<\/sub>c<sub>23<\/sub> &lt; 0, so s = −1, which is impossible for positive weights (K is then positive semidefinite). The program tetra3_positive.py carries out the proof with fractions. So the 6-node rule is minimal among rules with positive weights, wherever the nodes lie.<\/li><li>Tetrahedron degree 5: at least 13 nodes for any real weights (the structural bound gives 12). With 12 nodes, K has rank 2, K = GSG<sup>T<\/sup> with S = diag(±1, ±1), and B<sub>i<\/sub> = A<sub>2,i<\/sub>G gives M<sub>ij<\/sub> = B<sub>i<\/sub>SB<sub>j<\/sub><sup>T<\/sup> − B<sub>j<\/sub>SB<sub>i<\/sub><sup>T<\/sup>. Since rank M<sub>ij<\/sub> = 4, the column spaces S<sub>i<\/sub> of B<sub>i<\/sub> are complementary planes in the column space of M<sub>ij<\/sub> and Lagrangian for the 2-form inverse to M<sub>ij<\/sub>. In exact arithmetic these conditions determine S<sub>1<\/sub>, S<sub>2<\/sub>, S<sub>3<\/sub> uniquely; then the equations are linear in P<sub>ij<\/sub> = X<sub>i<\/sub>SX<sub>j<\/sub><sup>T<\/sup> (B<sub>i<\/sub> = S<sub>i<\/sub>X<sub>i<\/sub>), and (P<sub>12<\/sub>P<sub>23<\/sub><sup>−T<\/sup>)<sup>−1<\/sup>P<sub>13<\/sub> = X<sub>3<\/sub>SX<sub>3<\/sub><sup>T<\/sup> would have to be symmetric. It is not, so no such rule exists. The program tetra5_bound.py carries out the proof with fractions; its option --selftest checks the procedure on artificial data with known G and S of every signature.<\/li><\/ul><h3 id=\"e-gauss\">Gauss product<\/h3><p>The rule built from one-dimensional Gauss formulas needs ⌈(n+1)/2⌉<sup>d<\/sup> nodes. On the triangle and tetrahedron it arises through collapsed coordinates (Duffy map) with Gauss–Jacobi formulas. It serves as a yardstick and grows like n<sup>d<\/sup>/2<sup>d<\/sup>.<\/p><h3 id=\"e-lit\">Column N<sub>Lit<\/sub> (literature)<\/h3><p>Smallest published node count recorded for the domain and degree. The column combines the literature comparison tables and the literature families listed below. The source for each row follows the value; when several publications attain the same count, only the earliest is credited.<\/p><h3 id=\"e-xg\">Xiao–Gimbutas<\/h3><p>Node counts of the numerically constructed rules of Xiao and Gimbutas <a class=\"cite\" href=\"#r18\">[18]<\/a> (triangle and square up to degree 20, tetrahedron up to degree 12 recorded here; for the triangle they coincide with <a class=\"cite\" href=\"#r13\">[13]<\/a><a class=\"cite\" href=\"#r21\">[21]<\/a>). The rules have positive weights and nodes inside the domain. No values are recorded for the cube, so the column is omitted there.<\/p><h3 id=\"e-sym\">Literature, fully symmetric<\/h3><p>Smallest known rules with the full symmetry group of the domain, positive weights and interior nodes: square <a class=\"cite\" href=\"#r21\">[21]<\/a><a class=\"cite\" href=\"#r30\">[30]<\/a>, tetrahedron <a class=\"cite\" href=\"#r21\">[21]<\/a>, cube <a class=\"cite\" href=\"#r21\">[21]<\/a><a class=\"cite\" href=\"#r30\">[30]<\/a>. For every degree the smallest rule of degree ≥ n is listed. Full symmetry is convenient for the finite element method and costs nodes, so these values lie above the ones found here. The fully symmetric tetrahedron rules of Jaśkowiec and Sukumar through degree 20 <a class=\"cite\" href=\"#r23\">[23]<\/a> are shown in their own literature family rather than in this column.<\/p><h3 id=\"e-out\">Column N<sub>PO<\/sub> (positive weights, nodes outside allowed)<\/h3><p>This column (triangle, square and tetrahedron) holds PO rules and is <b>not<\/b> a PI rule in the atlas sense: weights are positive, but single nodes may lie outside the domain (Duffy parameters in [−0.7, 1.7]). Such rules often need fewer nodes, e.g. on the triangle at degree 12: 31 instead of 32 nodes, exactly the counting value. Below the counting value the search found nothing even with this relaxation. Nodes outside need a function that is defined there, so the rule is not usable for √ or log. It may also amplify rounding errors more than an interior rule. The numbers come from our own search; every rule smaller than the PI rule is proven with interval arithmetic like the PI rules. A value equal to N<sub>PI<\/sub> means the search with outside nodes found no smaller rule. A “–” means not searched yet.<\/p><h3>Search method<\/h3><ul><li>Damped Gauss–Newton (Levenberg–Marquardt) on the moment equations in an orthonormal basis: Legendre products, or Dubiner polynomials for simplices.<\/li><li>Simplices are mapped to parameter boxes [0,1]<sup>d<\/sup> by the Duffy map so nodes never leave the domain.<\/li><li>Start with random nodes just above the counting value, then node removal <a class=\"cite\" href=\"#r26\">[26]<\/a>: the node with a small weight is dropped and the rest is solved again. High degrees start from the rule of the previous degree plus extra nodes.<\/li><li>Square and cube use central symmetry (pairs ±p) at odd degrees, which halves the unknowns. The approach follows the methods in <a class=\"cite\" href=\"#r18\">[18]<\/a> and the survey <a class=\"cite\" href=\"#r11\">[11]<\/a>.<\/li><\/ul><\/div>\n<div><h3 id=\"e-noise\">Computing accuracy in the error plot<\/h3><p>With 64-bit numbers (unit roundoff u = 2<sup>−53<\/sup> ≈ 1.1·10<sup>−16<\/sup>) the error cannot become arbitrarily small. The orange line is a bound in two parts: (N+2)·u·Σ|wᵢ f(xᵢ)| for rounding in the summation and in the function evaluation, divided by |I|, plus the measured effect of rounding nodes and weights to 15 digits (eight random patterns of ±5·10<sup>−16<\/sup>). For oscillating functions such as the sine, Σ|wᵢ f(xᵢ)| is much larger than |Q|, so the bound sits near 10<sup>−14<\/sup> instead of 10<sup>−16<\/sup>. Errors below the line are rounding noise and say nothing more about the rule.<\/p><h3 id=\"e-check\">Moment check<\/h3><p>Every rule was checked independently against the exact integrals with all monomials up to degree n (weights positive, nodes inside the domain). The Proof section lists the largest residual in the orthonormal basis, computed from the 15 decimals stored on this page.<\/p><h3 id=\"e-cert\">Numerical check for a nearby solution (not a proof)<\/h3><p>For x₀ = (nodes, weights), F(x) maps to the moments. The system is underdetermined (unknowns ≥ equations) and the Jacobian J(x₀) has full row rank. With σ the smallest singular value of J, η = ‖J⁺F(x₀)‖ and a Lipschitz constant L of J, the Newton–Kantorovich theorem for underdetermined systems (Ben-Israel) applies: if <span class=\"m\">h = L·η/σ² ≤ ½<\/span>, an exact solution x* exists with ‖x*−x₀‖ ≤ 2η.<\/p><p>For centrally symmetric rules the reduced system for the pairs ±p is used. L is estimated in 40 random directions and multiplied by 2. This is a numerical check in floating point and not a proof; the proof is the interval proof (tools/verify_rigorous.py). Whether the ball around x₀ contains weights ≤ 0 or points outside is shown in the last column.<\/p><h3 id=\"why\">Why does the Gauss product sometimes beat a rule with fewer nodes?<\/h3><p>The degree only says up to which polynomials a rule is exact. How well it integrates a particular smooth function depends on its error for the terms above. Measured on the square (orthonormal Legendre products of degree n+1 to n+7, root mean square error) there are three reasons.<\/p><ul><li><b>Symmetry.<\/b> The Gauss product is point symmetric and so integrates every term of odd total degree exactly, half of all terms. The minimal-node rules lack this symmetry; their error at degrees n+1, n+3, … lies between 0.2 and 0.9.<\/li><li><b>Tensor space.<\/b> An m×m product is exact on all x<sup>i<\/sup>y<sup>j<\/sup> with i, j ≤ 2m−1, i.e. 4 functions per node. The minimal rules are exact on all polynomials up to degree n, only about 3 functions per node. At even degrees above, the product misses only terms with one exponent too high; the error there is 3 to 10 times smaller (n = 18, 64 nodes, degree 20: 0.39 against 0.11).<\/li><li><b>No slack.<\/b> A rule at the lower node bound satisfies exactly the moment equations up to degree n. No degree of freedom is left for the error above.<\/li><\/ul><p>Consequence: functions that are almost a polynomial of degree ≤ n win with the minimal rule (on the square for |sin 2z|² and sinc from degree 10). Functions with strong terms above, such as the sine with frequency 4, the banana or the cosine test function, often win with the Gauss product. The error curves below show both; this does not contradict the node counts in the table.<\/p><h3 id=\"d30\">Higher degrees (above 20)<\/h3><p>Up to degree 20 the rules come from direct numerical search. At higher degrees, rules come from continued direct search, symmetry-reduced orbit searches (such as C4 on the square, A4/S4 on the tetrahedron, and Oh/Td on the cube) and recursive simplicial-shell constructions, all proven with interval arithmetic. Degrees not yet covered by our search show a dash in N<sub>PI<\/sub> (while still listing published rules where available). For all rules in the atlas the node count never exceeds the Gauss product.<\/p><h3 id=\"fn\">More test functions: Ackley and Genz<\/h3><p>The Ackley function <a class=\"cite\" href=\"#r7\">[7]<\/a> is a standard optimisation benchmark. It is smoothed here (√(m + δ²) with δ = 0.3 instead of √m), because the cusp at the origin would otherwise limit every reference computation to a few digits. The four Genz families oscillatory, product peak, corner peak and Gaussian are smooth and have closed-form integral values <a class=\"cite\" href=\"#r5\">[5]<\/a><a class=\"cite\" href=\"#r29\">[29]<\/a>. They are defined in u = (x + 1) / 2 on the unit cube, or in the coordinates x of the simplex. On square and cube the closed formula is the exact value, on triangle and tetrahedron a high-order Gauss product. The Genz families “continuous” and “discontinuous” are left out because non-smooth functions limit every rule to the same low accuracy.<\/p><h3 id=\"cos\">Cosine test function<\/h3><p>Diallo and Worku <a class=\"cite\" href=\"#r30\">[30]<\/a> test with cos(10x + 25y) on the square. That oscillates so strongly that hardly any error drops below 1 up to degree 30. Here we use f = 1 + cos(t₁ + π·t₂) instead (on the cube 1 + cos(t₁ + π·t₂ + 2·t₃)). The 1 is needed: on a symmetric domain the integral of cos(x + πy) is 0, so a relative error would be undefined. The constant does not change the absolute error of the rules, it only gives a denominator ≠ 0. On square and cube the exact value is 2<sup>d<\/sup> + Π 2·sin(aᵢ)/aᵢ, on triangle and tetrahedron (t = 2x − 1) a high-order Gauss product.<\/p><h3 id=\"e-repro\">Origin of the rules and reproduction<\/h3><p>Every rule in the tables passed these checks before it was accepted: the monomial check (all monomials up to degree n, error below 10<sup>−12<\/sup>), the numerical Newton–Kantorovich check (h ≤ ½) and the interval proof (tools/verify_rigorous.py). For PI rules the whole ball around the solution must also stay inside the domain with all weights positive. Rules that fail are discarded and not shown. Nodes and weights are stored with 15 digits; the numerical check and the interval proof are computed for the rounded data.<\/p><ul><li><b>Interval:<\/b> closed formulas. Gauss–Legendre: N = ⌈(n+1)/2⌉ nodes, the zeros of P<sub>N<\/sub>. Gauss–Lobatto: N = ⌈(n+3)/2⌉, the end points and the zeros of P′<sub>N−1<\/sub>. Clenshaw–Curtis: Chebyshev extrema cos(jπ/(N−1)). Equidistant (Newton–Cotes): equally spaced nodes with end points. For the three interpolatory rules the weights come from the linear system of Legendre moments up to degree N−1; N is the smallest node count whose rule reaches degree n.<\/li><li><b>Triangle and tetrahedron:<\/b> <code>kubatur.py<\/code> (start nodes, Levenberg–Marquardt, node removal) up to about degree 20; above, start from the rule of the previous degree plus new nodes in the largest gaps (<code>seed_tri2.py<\/code>, random starts with seed 100+s). Triangle degree 25 (117 nodes) comes from this start-from-previous-degree search.<\/li><li><b>Square:<\/b> degrees 1 to 20 with <code>dom.py<\/code>/<code>cs.py<\/code> (solver, central symmetry), degrees 21 to 30 with <code>seed_sq.py<\/code> (even degrees, no symmetry, start from a lower degree) and <code>seed_cs.py<\/code> (odd degrees, centrally symmetric: pairs ±p, below the counting value from degree 9). Central symmetry gave no gain at even degrees.<\/li><li><b>PO:<\/b> the same solvers with widened bounds (triangle: Duffy parameters in [−0.7, 1.7], square: coordinates in [−3, 3]), weights ≥ 0 (<code>free_search.py<\/code>, <code>sqelim.py<\/code> in mode b). PO = PI where the search found nothing smaller.<\/li><li><b>Cube:<\/b> fully symmetric rules (group Oh or Td) from <code>cubature_search.py<\/code> (orbit types, symmetry reduction, post-processing), re-checked with <code>verify_rules.py<\/code>. These rules are marked ‡; their numerical check and their interval proof use the symmetry-reduced system (<code>cube_cert.py<\/code>, run with <code>python run_cube_cert.py 2,10,14 a<\/code>).<\/li><li><b>Symmetry-reduced and shell searches at higher degrees:<\/b> C4-symmetric searches on the square, A4/S4 orbit and recursive simplicial-shell searches on the tetrahedron, and Oh/Td symmetry reduction on the cube extend the atlas well beyond degree 20.<\/li><\/ul><p><b>Reproduction.<\/b> All scripts are in the source code section. Put them in one directory with a subfolder <code>lib/<\/code> (holding <code>cubature_atlas.py<\/code>). Packages: numpy, scipy. The start-from-previous-degree scripts read start rules from <code>allrules30.json<\/code> (format {\"rules\": {domain: {degree: {\"n\": nodes, \"pts\": [[coordinates…, weight], …]}}}}); the point list of each rule can be copied from Figure A. Examples:<\/p><div class=\"formula\">python kubatur.py auto triangle 12 --time 600<br>python seed_tri2.py 25 2 117 20 120<br>python seed_sq.py 22 2 92 d 12 150<br>python seed_cs.py 21 81 d 8 100<br>python sqelim.py 30 b 80 1<br>python free_search.py triangle 14,18 20<\/div><p>The scripts write rules as <code>.npy<\/code> (columns: coordinates, weight) and save only after the monomial check and the numerical check pass; the interval proof follows before a rule is added to the atlas. <code>python kubatur.py check rule_triangle_d12_n34.npy<\/code> checks a file. Run times: seconds to a few minutes per attempt on two cores; random starts are fixed by seeds, but results depend on library versions and rounding. The numbers on this page are upper bounds for the true minimum.<\/p><h3 id=\"e-figs\">How the figures are made<\/h3><p><b>Figure A:<\/b> the dancing polynomial is a linear combination of the Legendre basis (products on the square and cube) up to degree n with time-shifted phases, normalised to maximum 1. On the interval the grey area shows the integral, the bars show width = weight and height = polynomial value at the node. In 2D and 3D the nodes carry columns or cells: the tiling of the domain is a power diagram (weighted Voronoi diagram) whose cell areas are iterated (up to 300 steps, step size 0.4, 22 nearest neighbours) until they equal the weights; in 3D these are plain Voronoi cells. Green: value positive, red: negative, orange: negative weight.<\/p><p><b>Figures C to E:<\/b> the error is relative to the exact value (analytic or high-order Gauss reference); the orange line is the computing accuracy (see above).<\/p><h3>Limits<\/h3><p>Node counts are upper bounds for the true minimum. That no smaller rule exists is proven only where “found” equals the lower bound. Higher degrees continue to be improved as new searches finish and are not yet exhausted. The Gauss product is hidden in the chart at first because it breaks the scale; the legend switches it on.<\/p><h3>Formula collections<\/h3><p>More rules, also with symmetry, boundary nodes or negative weights, are in the encyclopaedia <a class=\"cite\" href=\"#r14\">[14]<\/a>, the collections <a class=\"cite\" href=\"#r32\">[32]<\/a><a class=\"cite\" href=\"#r33\">[33]<\/a> and in <a class=\"cite\" href=\"#r6\">[6]<\/a><a class=\"cite\" href=\"#r13\">[13]<\/a> (triangle). The collection <a class=\"cite\" href=\"#r32\">[32]<\/a> alone cites 26 sources, among them Lyness and Jespersen (1975), Papanicolopulos (2015, 2016), Taylor (2008), Vioreanu and Rokhlin (2014) and Williams et al. (2014).<\/p><\/div>\n","de":"<div><h3 id=\"e-task\">Aufgabe<\/h3><p>Eine Kubaturregel ist eine Summe <span class=\"m\">Σ wᵢ f(xᵢ)<\/span>, die das Integral von f über das Gebiet für alle Polynome vom Gesamtgrad ≤ n exakt wiedergibt. Gesucht ist die kleinste Knotenzahl N. Hier gilt zusätzlich: alle Gewichte positiv, alle Knoten im abgeschlossenen Gebiet. Überblicke geben <a class=\"cite\" href=\"#r10\">[10]<\/a><a class=\"cite\" href=\"#r11\">[11]<\/a>.<\/p><h3>Referenzgebiete<\/h3><ul><li>Intervall [−1,1], Länge 2<\/li><li>Quadrat [−1,1]², Fläche 4<\/li><li>Dreieck (0,0), (1,0), (0,1), Fläche ½<\/li><li>Tetraeder (0,0,0), (1,0,0), (0,1,0), (0,0,1), Volumen ⅙<\/li><li>Würfel [−1,1]³, Volumen 8<\/li><\/ul><h3 id=\"e-not\">Bezeichnungen<\/h3><p>n: Grad, d: Dimension, N: Knotenzahl. <b>PI<\/b> (positive, inner): positive Gewichte, alle Knoten im abgeschlossenen Gebiet (Randpunkte zählen mit). Das ist die Bedingung des Atlas. <b>PO<\/b> (positive, outer): positive Gewichte, Knoten dürfen auch außerhalb liegen.<\/p><p>Spalten: N<sub>PI<\/sub> kleinste bekannte PI-Regel, Z Abzählwert (bei Quadrat und Würfel der kleinere von allgemeinem und symmetrischem Abzählwert), Δ = N<sub>PI<\/sub> − Z, L untere Schranke, N<sub>G<\/sub> Gauß-Produkt, N<sub>Lit<\/sub> kleinster Literaturwert (Xiao–Gimbutas oder symmetrische Regeln), N<sub>PO<\/sub> kleinste bekannte PO-Regel.<\/p><h3 id=\"e-found\">Spalte N<sub>PI<\/sub> (kleinste bekannte PI-Regel)<\/h3><p>Knotenzahl der kleinsten Regel, die diese Seite für den Grad kennt. Sie stammt aus einer eigenen numerischen Suche (Abschnitt Suchverfahren) und ist mit allen Monomen geprüft, numerisch (Newton-Kantorovich) kontrolliert und mit Intervallarithmetik bewiesen. Jede Regel ist zugleich eine gültige Regel für alle kleineren Grade.<\/p><h3 id=\"e-delta\">Spalte Δ<\/h3><p>Differenz „gefunden“ minus Abzählwert. Negative Werte bedeuten, dass die Regel kleiner ist als die Faustregel.<\/p><h3 id=\"e-abz\">Abzählwert<\/h3><p>Die Momentengleichungen sind ein nichtlineares System. Zählt man Gleichungen und Unbekannte, braucht eine Regel ungefähr so viele Knoten, wie diese Rechnung ergibt:<\/p><div class=\"formula\">Z(n, d) = ⌈ M(n, d) / (d + 1) ⌉<br>M(n, d) = C(n+d, d) = (n+d)! / (n!·d!)<\/div><p>Hier ist n der Grad, d die Dimension (Intervall 1, Dreieck und Quadrat 2, Tetraeder und Würfel 3), M(n,d) die Zahl der Monome vom Grad ≤ n, also die Dimension des Polynomraums, und Z(n,d) der Abzählwert. Jeder Knoten bringt d Koordinaten und ein Gewicht mit, also d+1 Unbekannte. Beispiel Dreieck, n = 20: M = C(22,2) = 231, Z = ⌈231/3⌉ = 77. Ein Grad mehr bringt genau die Monome vom exakten Grad n+1 hinzu, M(n+1,d) − M(n,d) = C(n+d, d−1). Damit wächst Z je Grad um etwa<div class=\"formula\">Z(n+1, d) − Z(n, d) ≈ C(n+d, d−1) / (d + 1)<\/div><p>Ausgeschrieben:<\/p><div class=\"formula\">d = 2: Z(n) = ⌈ (n+1)(n+2) / 6 ⌉<br>Z(n+1) − Z(n) ∈ { ⌊(n+2)/3⌋, ⌈(n+2)/3⌉ }<br><br>d = 3: Z(n) = ⌈ (n+1)(n+2)(n+3) / 24 ⌉<br>Z(n+1) − Z(n) ∈ { ⌊(n+2)(n+3)/8⌋, ⌈(n+2)(n+3)/8⌉ }<\/div><p>Der Zuwachs je Grad ist also bis auf Rundung (n+2)/3 im Dreieck bzw. (n+2)(n+3)/8 im Tetraeder. Für großes n gilt Z ≈ nᵈ / (d!·(d+1)), das Gauß-Produkt dagegen wächst wie (n/2)ᵈ. Das Verhältnis ist also ≈ 2ᵈ/(d!·(d+1)): Faktor 2/3 in Dreieck und Quadrat (4/(2·3)), 1/3 in Tetraeder und Würfel (8/(6·4)). Der Wert ist eine Faustregel und keine Schranke: Regeln können darunter oder darüber liegen.<\/p><h3 id=\"e-zsym\">Quadrat und Würfel: symmetrischer Abzählwert<\/h3><p>Quadrat und Würfel sind zentralsymmetrisch. Ist eine Regel symmetrisch unter x ↦ −x (gleiche Gewichte in x und −x), wird jedes Monom ungeraden Grades schon durch die Symmetrie exakt integriert, weil Integral und Summe beide verschwinden. Als Gleichungen bleiben nur die Monome geraden Grades, und ein Knotenpaar ±x bringt d+1 Unbekannte für 2 Knoten:<\/p><div class=\"formula\">E(n, d) = Σ<sub>j gerade, j ≤ n<\/sub> C(j+d−1, d−1)<br>Z<sub>sym<\/sub>(n, d) = ⌈ 2·E(n, d) / (d + 1) ⌉<\/div><p>Bei Quadrat und Würfel zeigt die Spalte Z den kleineren der beiden Werte:<\/p><div class=\"formula\">Z = min( ⌈ M(n, d) / (d + 1) ⌉, Z<sub>sym<\/sub>(n, d) )<\/div><p>Welcher kleiner ist, hängt nur von der Parität von n ab. Man teilt die Monome vom Grad ≤ n in E gerade und O ungerade, M = E + O. Dann ist Z<sub>sym<\/sub> &lt; Z genau dann, wenn O &gt; E. Die Schicht vom exakten Grad j hat C(j+d−1, d−1) Monome, das wächst mit j, also entscheidet die oberste Schicht: Bei ungeradem n gibt es mehr ungerade Monome, der symmetrische Wert ist kleiner. Bei geradem n gibt es mehr gerade Monome; eine symmetrische Regel ist dann automatisch auch für den Grad n+1 exakt und bezahlt das mit zusätzlichen Knoten, also ist der allgemeine Wert kleiner. Daher gilt Z<sub>sym<\/sub>(2k) = Z<sub>sym<\/sub>(2k+1) und<\/p><div class=\"formula\">Z(2k) ≤ Z<sub>sym<\/sub>(2k+1) ≤ Z(2k+1)  (allgemeines Z)<\/div><p>Ausgeschrieben für ungerades n:<\/p><div class=\"formula\">d = 2: Z(n) = ⌈ (n+1)² / 6 ⌉<br>d = 3: Z(n) = ⌈ (n+1)(n+3)(2n+1) / 48 ⌉<\/div><p>Das senkt den Abzählwert bei ungeraden Graden um etwa (n+1)/6 im Quadrat und (n+1)(n+3)/16 im Würfel. Beispiel Würfel, n = 9: E = 1+6+15+28+45 = 95, Z = 48 statt 55; die gefundene Regel hat 48 Knoten und ist zentralsymmetrisch.<\/p><p>Dreieck und Tetraeder haben kein Symmetriezentrum: Die Abbildung x ↦ −x (um den Schwerpunkt) bildet sie auf eine andere Menge ab, keine Regel kann diese Symmetrie haben, ungerade Momente verschwinden nicht, und es gilt der allgemeine Abzählwert. Im Intervall stimmen beide Werte für ungerades n überein; Gauß-Regeln sind dort zugleich symmetrisch und optimal.<\/p><\/div>\n<div><h3 id=\"e-low\">Untere Schranke<\/h3><ul><li>Grad 2k: mindestens dim P<sub>k<\/sub> = C(k+d,d) Knoten, für jedes Gebiet <a class=\"cite\" href=\"#r3\">[3]<\/a>. Für gerade Grade ist keine schärfere allgemeine Schranke bekannt <a class=\"cite\" href=\"#r11\">[11]<\/a><a class=\"cite\" href=\"#r19\">[19]<\/a>, und bei kleinen Graden ist auch keine möglich: Die Schranke wird erreicht im Dreieck bei den Graden 2, 4, 6 (3, 6, 10 Knoten; bei Grad 6 nur von der PO-Regel), im Quadrat bei den Graden 2 bis 8 (3, 6, 10, 15 Knoten; bei Grad 8 von der PO-Regel), in Tetraeder und Würfel bei den Graden 2 und 4 (4 und 10 Knoten; Tetraeder Grad 4 von der PO-Regel).<\/li><li>Ungerade Grade 2k−1 auf dem Quadrat: die schärfere Möller-Schranke dim P<sub>k−1<\/sub> + ⌊k/2⌋ <a class=\"cite\" href=\"#r3\">[3]<\/a>.<\/li><li>Ungerade Grade 2k−1 auf dem Dreieck: derselbe Wert dim P<sub>k−1<\/sub> + ⌊k/2⌋. Er folgt aus Möllers allgemeiner Schranke <a class=\"cite\" href=\"#r4\">[4]<\/a>, die keine Symmetrie braucht, in der Form von Xu <a class=\"cite\" href=\"#r27\">[27]<\/a>: N ≥ dim P<sub>k−1<\/sub> + ½·rank(A<sub>k−1,1<\/sub>A<sub>k−1,2<\/sub><sup>T<\/sup> − A<sub>k−1,2<\/sub>A<sub>k−1,1<\/sub><sup>T<\/sup>). Die A<sub>k−1,i<\/sub> sind die Matrizen der Dreiterm-Rekursion x<sub>i<\/sub>P<sub>k−1<\/sub> = A<sub>k−1,i<\/sub>P<sub>k<\/sub> + … der orthonormalen Polynome (Dubiner-Basis) <a class=\"cite\" href=\"#r9\">[9]<\/a>. Die Matrix in der Klammer ist schiefsymmetrisch der Größe k, ihr Rang ist also gerade und höchstens 2⌊k/2⌋. Das Programm triangle_moeller.py berechnet den Rang exakt mit Brüchen: Für jeden ungeraden Grad von 3 bis 29 ist er maximal; für die ungeraden Grade von 31 bis 49 liefert moeller_bound.py dasselbe (Rang modulo einer Primzahl, siehe unten beim Tetraeder). Folgerungen: Die Regeln mit 4, 7 und 12 Knoten bei den Graden 3, 5 und 7 sind minimal, und weil der Rang nie 0 ist, gibt es auf dem Dreieck keine Gauß-Regel mit nur dim P<sub>k−1<\/sub> Knoten (die Bedingung von Mysovskikh ist verletzt). Die Schranke gilt für beliebige reelle Gewichte und Knoten an beliebiger Stelle; ein kurzer Beweis steht im Kopf von moeller_bound.py.<\/li><li>Ungerade Grade 2k+1 auf dem Tetraeder: dasselbe Argument in drei Variablen. Mit den drei Matrizen M<sub>ij<\/sub> = A<sub>k,i<\/sub>A<sub>k,j<\/sub><sup>T<\/sup> − A<sub>k,j<\/sub>A<sub>k,i<\/sub><sup>T<\/sup> folgt N ≥ dim P<sub>k<\/sub> + ρ mit ρ ≥ ⌈rank M<sub>ij<\/sub>/2⌉ für jedes Paar und ρ ≥ ⌈rank(M<sub>12<\/sub>|M<sub>13<\/sub>|M<sub>23<\/sub>)/3⌉. Das Programm moeller_bound.py berechnet die Ränge exakt modulo einer Primzahl; ein Rang modulo einer Primzahl ist nie größer als der rationale Rang, die Werte sind also bewiesen. Für alle ungeraden Grade von 3 bis 39 sind die Paar-Ränge dim V<sub>k<\/sub> − ⌈(k+1)/2⌉ (dim V<sub>k<\/sub> = (k+1)(k+2)/2). Das ergibt L = dim P<sub>k<\/sub> + (dim V<sub>k<\/sub> − ⌈(k+1)/2⌉)/2, z. B. 5, 12, 24, 41 Knoten bei den Graden 3, 5, 7, 9 (vorher 4, 10, 20, 35).<\/li><li>Ungerade Grade 2k+1 auf dem Würfel: Möllers Schranke für zentralsymmetrische Integrale <a class=\"cite\" href=\"#r4\">[4]<\/a>, N ≥ 2·dim P<sub>k<\/sub><sup>ung<\/sup> für ungerades k und N ≥ 2·dim P<sub>k<\/sub><sup>ger<\/sup> − 1 für gerades k. Dabei sind P<sub>k<\/sub><sup>ger<\/sup>, P<sub>k<\/sub><sup>ung<\/sup> die Polynome vom Grad ≤ k aus Monomen geraden bzw. ungeraden Grades. In der expliziten Form von Hinrichs und Novak <a class=\"cite\" href=\"#r15\">[15]<\/a> ist das 2d, d<sup>2<\/sup>+d+1 und (d<sup>3<\/sup>+3d<sup>2<\/sup>+8d)/3 bei den Graden 3, 5, 7. Beim Würfel ist sie größer als die Schranke aus den Strukturmatrizen (die die Werte des Tetraeders liefert). Folgerung: Die Würfelregeln mit 6, 13 und 26 Knoten bei den Graden 3, 5 und 7 sind minimal.<\/li><li>Positive Gewichte, Tetraeder Grad 3: mindestens 6 Knoten (die allgemeine Schranke 5 wird nur mit einem negativen Gewicht erreicht). Mit 5 Knoten hat die diskrete Gram-Matrix K der Orthogonalpolynome vom Grad 2 den Rang 1, K = s·gg<sup>T<\/sup>. Die Gleichungen s·(a<sub>i<\/sub> × a<sub>j<\/sub>) = m<sub>ij<\/sub> mit a<sub>i<\/sub> = A<sub>1,i<\/sub>g haben nur dann eine reelle Lösung, wenn s·c<sub>12<\/sub>c<sub>13<\/sub>c<sub>23<\/sub> &gt; 0 ist, wobei m<sub>ij<\/sub> = c<sub>ij<\/sub>(u<sub>i<\/sub> × u<sub>j<\/sub>) mit festen Vektoren u<sub>i<\/sub>. Die exakten Werte ergeben c<sub>12<\/sub>c<sub>13<\/sub>c<sub>23<\/sub> &lt; 0, also s = −1, und das ist mit positiven Gewichten unmöglich (K ist dann positiv semidefinit). Das Programm tetra3_positive.py führt den Beweis mit Brüchen. Die 6-Knoten-Regel ist also unter den Regeln mit positiven Gewichten minimal, egal wo die Knoten liegen.<\/li><li>Tetraeder Grad 5: mindestens 13 Knoten für beliebige reelle Gewichte (die Strukturschranke liefert 12). Mit 12 Knoten hat K den Rang 2, K = GSG<sup>T<\/sup> mit S = diag(±1, ±1), und B<sub>i<\/sub> = A<sub>2,i<\/sub>G ergibt M<sub>ij<\/sub> = B<sub>i<\/sub>SB<sub>j<\/sub><sup>T<\/sup> − B<sub>j<\/sub>SB<sub>i<\/sub><sup>T<\/sup>. Wegen rank M<sub>ij<\/sub> = 4 sind die Spaltenräume S<sub>i<\/sub> der B<sub>i<\/sub> komplementäre Ebenen im Spaltenraum von M<sub>ij<\/sub> und Lagrangesch für die zu M<sub>ij<\/sub> inverse 2-Form. Exakt gerechnet legen diese Bedingungen S<sub>1<\/sub>, S<sub>2<\/sub>, S<sub>3<\/sub> eindeutig fest; danach sind die Gleichungen linear in P<sub>ij<\/sub> = X<sub>i<\/sub>SX<sub>j<\/sub><sup>T<\/sup> (B<sub>i<\/sub> = S<sub>i<\/sub>X<sub>i<\/sub>), und (P<sub>12<\/sub>P<sub>23<\/sub><sup>−T<\/sup>)<sup>−1<\/sup>P<sub>13<\/sub> = X<sub>3<\/sub>SX<sub>3<\/sub><sup>T<\/sup> müsste symmetrisch sein. Das ist sie nicht, also gibt es keine solche Regel. Das Programm tetra5_bound.py führt den Beweis mit Brüchen; die Option --selftest prüft das Verfahren an künstlichen Daten mit bekanntem G und S jeder Signatur.<\/li><\/ul><h3 id=\"e-gauss\">Gauß-Produkt<\/h3><p>Die Regel aus eindimensionalen Gauß-Formeln benötigt ⌈(n+1)/2⌉<sup>d<\/sup> Knoten. Bei Dreieck und Tetraeder entsteht sie über kollabierte Koordinaten (Duffy-Abbildung) mit Gauß-Jacobi-Formeln. Sie dient als Vergleichsmaßstab und wächst mit n<sup>d<\/sup>/2<sup>d<\/sup>.<\/p><h3 id=\"e-lit\">Spalte N<sub>Lit<\/sub> (Literatur)<\/h3><p>Kleinste veröffentlichte Knotenzahl, die für das Gebiet und den Grad erfasst ist. Die Spalte führt die Literatur-Vergleichstabellen und die unten aufgeführten Literaturfamilien zusammen. Die Quelle jeder Zeile steht hinter dem Wert; erreichen mehrere Veröffentlichungen dieselbe Knotenzahl, wird nur die früheste genannt.<\/p><h3 id=\"e-xg\">Xiao–Gimbutas<\/h3><p>Knotenzahlen der numerisch konstruierten Regeln von Xiao und Gimbutas <a class=\"cite\" href=\"#r18\">[18]<\/a> (Dreieck und Quadrat bis Grad 20, Tetraeder bis Grad 12 hier erfasst; für Dreieck decken sie sich mit <a class=\"cite\" href=\"#r13\">[13]<\/a><a class=\"cite\" href=\"#r21\">[21]<\/a>). Die Regeln haben positive Gewichte und Knoten im Gebiet. Für den Würfel sind keine Werte erfasst, die Spalte entfällt dort.<\/p><h3 id=\"e-sym\">Literatur, voll symmetrisch<\/h3><p>Kleinste bekannte Regeln mit voller Symmetriegruppe des Gebiets, positiven Gewichten und inneren Knoten: Quadrat <a class=\"cite\" href=\"#r21\">[21]<\/a><a class=\"cite\" href=\"#r30\">[30]<\/a>, Tetraeder <a class=\"cite\" href=\"#r21\">[21]<\/a>, Würfel <a class=\"cite\" href=\"#r21\">[21]<\/a><a class=\"cite\" href=\"#r30\">[30]<\/a>. Aufgeführt ist für jeden Grad die kleinste Regel mit Grad ≥ n. Volle Symmetrie ist für die Finite-Elemente-Methode bequem und kostet Knoten; deshalb liegen diese Werte über den hier gefundenen. Die voll symmetrischen Tetraederregeln von Jaśkowiec und Sukumar bis Grad 20 <a class=\"cite\" href=\"#r23\">[23]<\/a> werden in ihrer eigenen Literaturfamilie statt in dieser Spalte gezeigt.<\/p><h3 id=\"e-out\">Spalte N<sub>PO<\/sub> (positive Gewichte, Knoten außen erlaubt)<\/h3><p>Diese Spalte (Dreieck, Quadrat und Tetraeder) enthält PO-Regeln und ist <b>keine<\/b> PI-Regel im Sinne des Atlas: Die Gewichte sind positiv, aber einzelne Knoten dürfen außerhalb des Gebiets liegen (Parameter der Duffy-Abbildung in [−0,7; 1,7]). Solche Regeln gibt es oft mit weniger Knoten, im Dreieck zum Beispiel bei Grad 12 mit 31 statt 32 Knoten, also genau beim Abzählwert. Unter dem Abzählwert fand die Suche auch mit dieser Lockerung nichts. Außerhalb liegende Knoten brauchen eine Funktion, die dort definiert ist. Für √ oder log ist die Regel deshalb nicht verwendbar. Sie kann zudem Rundungsfehler stärker verstärken als eine innere Regel. Die Zahlen stammen aus eigener Suche; jede Regel, die kleiner als die PI-Regel ist, ist wie die PI-Regeln mit Intervallarithmetik bewiesen. Steht dort ein Wert gleich N<sub>PI<\/sub>, hat die Suche mit Außenknoten keine kleinere Regel gefunden. Ein „–“ heißt: noch nicht gesucht.<\/p><h3>Suchverfahren<\/h3><ul><li>Gedämpftes Gauß-Newton-Verfahren (Levenberg–Marquardt) auf den Momentengleichungen in einer orthonormalen Basis: Legendre-Produkte beziehungsweise Dubiner-Polynome für Simplizes.<\/li><li>Simplizes sind über die Duffy-Abbildung auf Parameterboxen [0,1]<sup>d<\/sup> gezogen, damit Knoten das Gebiet nie verlassen.<\/li><li>Start mit Zufallsknoten knapp über dem Abzählwert, danach Knotenentfernung <a class=\"cite\" href=\"#r26\">[26]<\/a>: der Knoten mit kleinem Gewicht fällt weg, der Rest wird neu gelöst. Hohe Grade starten von der Regel des Vorgängergrads mit zusätzlichen Knoten.<\/li><li>Quadrat und Würfel nutzen bei ungeraden Graden Zentralsymmetrie (Paare ±p), das halbiert die Unbekannten. Der Ansatz folgt den Verfahren aus <a class=\"cite\" href=\"#r18\">[18]<\/a> und der Übersicht <a class=\"cite\" href=\"#r11\">[11]<\/a>.<\/li><\/ul><\/div>\n<div><h3 id=\"e-noise\">Rechengenauigkeit im Fehlerdiagramm<\/h3><p>Rechnet man mit 64-Bit-Zahlen (Einheitsrundung u = 2<sup>−53<\/sup> ≈ 1,1·10<sup>−16<\/sup>), kann der Fehler nicht beliebig klein werden. Die orange Linie ist eine Schranke aus zwei Teilen: (N+2)·u·Σ|wᵢ f(xᵢ)| für die Rundung beim Summieren und bei der Funktionsauswertung, geteilt durch |I|, plus die gemessene Wirkung der 15-stelligen Rundung von Knoten und Gewichten (acht Zufallsmuster mit ±5·10<sup>−16<\/sup>). Bei oszillierenden Funktionen wie dem Sinus ist Σ|wᵢ f(xᵢ)| deutlich größer als |Q|, die Schranke liegt dann bei etwa 10<sup>−14<\/sup> statt 10<sup>−16<\/sup>. Fehler unterhalb der Linie sind Rundungsrauschen und sagen nichts mehr über die Regel.<\/p><h3 id=\"e-check\">Nachprüfung der Momente<\/h3><p>Jede Regel wurde unabhängig mit allen Monomen bis zum Grad n gegen die exakten Integrale geprüft (Gewichte positiv, Knoten im Gebiet). Im Abschnitt Nachweis steht der größte Restfehler in der orthonormalen Basis, berechnet aus den auf dieser Seite gespeicherten 15 Nachkommastellen.<\/p><h3 id=\"e-cert\">Numerische Prüfung auf eine Lösung in der Nähe (kein Beweis)<\/h3><p>Für x₀ = (Knoten, Gewichte) bildet F(x) die Momente ab. Das System ist unterbestimmt (Unbekannte ≥ Gleichungen), die Jacobi-Matrix J(x₀) hat vollen Zeilenrang. Mit σ als kleinstem Singulärwert von J, η = ‖J⁺F(x₀)‖ und einer Lipschitz-Konstanten L von J gilt der Satz von Newton–Kantorovich für unterbestimmte Systeme (Ben-Israel): ist <span class=\"m\">h = L·η/σ² ≤ ½<\/span>, dann existiert eine exakte Lösung x* mit ‖x*−x₀‖ ≤ 2η.<\/p><p>Bei zentralsymmetrischen Regeln gilt das reduzierte System für die Paare ±p; bei den voll symmetrischen Würfelregeln (Oh, Td) sind die Unbekannten die Orbit-Parameter und Orbit-Gewichte, die Gleichungen die Momente der invarianten Polynome (Rest und Ableitung liegen bis auf 10<sup>−14<\/sup> in deren Raum). L wird in 40 Zufallsrichtungen geschätzt und mit 2 multipliziert. Das ist eine numerische Prüfung in Gleitkomma und kein Beweis; der Beweis ist der Intervall-Beweis (tools/verify_rigorous.py). Ob der Ball um x₀ Gewichte ≤ 0 oder Punkte außerhalb enthält, steht in der letzten Spalte.<\/p><h3 id=\"why\">Warum schlägt das Gauß-Produkt manchmal eine Regel mit weniger Knoten?<\/h3><p>Der Grad sagt nur, bis wohin eine Regel jedes Polynom exakt integriert. Wie gut sie eine bestimmte glatte Funktion trifft, hängt vom Fehler bei den Termen darüber ab. Gemessen am Quadrat (orthonormale Legendre-Produkte vom Grad n+1 bis n+7, quadratisches Mittel des Fehlers) zeigen sich drei Gründe.<\/p><ul><li><b>Symmetrie.<\/b> Das Gauß-Produkt ist punktsymmetrisch und integriert deshalb alle Terme von ungeradem Gesamtgrad exakt, die Hälfte aller Terme. Die Regeln mit minimaler Knotenzahl haben diese Symmetrie nicht; ihr Fehler liegt bei den Graden n+1, n+3, … zwischen 0,2 und 0,9.<\/li><li><b>Tensorraum.<\/b> Ein m×m-Produkt ist exakt auf allen x<sup>i<\/sup>y<sup>j<\/sup> mit i, j ≤ 2m−1, also auf 4 Funktionen je Knoten. Die minimalen Regeln sind exakt auf allen Polynomen bis Grad n, das sind nur etwa 3 Funktionen je Knoten. Bei geraden Graden darüber verfehlt das Produkt nur Terme mit einem zu hohen Einzelexponenten; der Fehler ist dort 3- bis 10-mal kleiner (n = 18, 64 Knoten, Grad 20: 0,39 gegen 0,11).<\/li><li><b>Kein Spielraum.<\/b> Eine Regel an der unteren Knotengrenze erfüllt genau die Momentengleichungen bis Grad n. Für den Fehler darüber bleibt kein Freiheitsgrad.<\/li><\/ul><p>Folge: Funktionen, die fast ein Polynom vom Grad ≤ n sind, gewinnen mit der minimalen Regel (im Quadrat bei |sin 2z|² und Sinc ab Grad 10). Funktionen mit starken Termen darüber, etwa Sinus mit Frequenz 4, Banane oder die Kosinus-Testfunktion, gewinnen oft mit dem Gauß-Produkt. Die Fehlerkurven unten zeigen beides; ein Widerspruch zu den Knotenzahlen der Tabelle ist das nicht.<\/p><h3 id=\"d30\">Höhere Grade (ab 21)<\/h3><p>Bis Grad 20 stammen die Regeln aus direkter numerischer Suche. Bei höheren Graden entstehen Regeln durch fortgesetzte direkte Suche, symmetriereduzierte Orbit-Suchen (etwa C4 auf dem Quadrat, A4/S4 auf dem Tetraeder und Oh/Td auf dem Würfel) sowie rekursive Schalen-Konstruktionen, alle in Intervallarithmetik bewiesen. Noch nicht durchsuchte Grade zeigen einen Strich in N<sub>PI<\/sub> (veröffentlichte Regeln bleiben dort sichtbar). Für alle Regeln des Atlas gilt: nie mehr Knoten als das Gauß-Produkt.<\/p><h3 id=\"fn\">Weitere Testfunktionen: Ackley und Genz<\/h3><p>Die Ackley-Funktion <a class=\"cite\" href=\"#r7\">[7]<\/a> ist ein Standardtest der Optimierung. Hier steht sie geglättet (√(m + δ²) mit δ = 0,3 statt √m), weil die Spitze im Nullpunkt sonst jede Referenzrechnung auf wenige Stellen begrenzt. Die vier Genz-Familien oszillierend, Produkt-Peak, Ecken-Peak und Gauß-Glocke sind glatt und haben geschlossene Integralwerte <a class=\"cite\" href=\"#r5\">[5]<\/a><a class=\"cite\" href=\"#r29\">[29]<\/a>. Sie sind in u = (x + 1) / 2 auf dem Einheitswürfel bzw. in den Koordinaten x des Simplex definiert. Auf Quadrat und Würfel dient die geschlossene Formel als exakter Wert, auf Dreieck und Tetraeder ein Gauß-Produkt hoher Ordnung. Die Genz-Familien „stetig“ und „unstetig“ fehlen, weil nichtglatte Funktionen jede Regel auf den gleichen niedrigen Fehler begrenzen.<\/p><h3 id=\"cos\">Kosinus-Testfunktion<\/h3><p>Diallo und Worku <a class=\"cite\" href=\"#r30\">[30]<\/a> testen mit cos(10x + 25y) im Quadrat. Das schwingt so stark, dass bis Grad 30 kaum ein Fehler unter 1 sinkt. Hier steht stattdessen f = 1 + cos(t₁ + π·t₂) (im Würfel 1 + cos(t₁ + π·t₂ + 2·t₃)). Die 1 ist nötig: Auf einem symmetrischen Gebiet ist das Integral von cos(x + πy) gleich 0, ein relativer Fehler wäre dann nicht definiert. Die Konstante ändert den absoluten Fehler der Regeln nicht, sie sorgt nur für einen Nenner ≠ 0. Auf Quadrat und Würfel ist der exakte Wert 2<sup>d<\/sup> + Π 2·sin(aᵢ)/aᵢ, auf Dreieck und Tetraeder (t = 2x − 1) ein Gauß-Produkt hoher Ordnung.<\/p><h3 id=\"e-repro\">Herkunft der Regeln und Reproduktion<\/h3><p>Jede Regel in den Tabellen hat diese Prüfungen bestanden, bevor sie aufgenommen wurde: Monomtest (alle Monome bis Grad n, Fehler unter 10<sup>−12<\/sup>), numerische Newton–Kantorovich-Prüfung (h ≤ ½) und Intervall-Beweis (tools/verify_rigorous.py). Bei PI-Regeln muss außerdem der ganze Ball um die Lösung im Gebiet liegen und alle Gewichte positiv halten. Regeln, die durchfallen, werden verworfen und nicht angezeigt. Gespeichert sind die Knoten und Gewichte mit 15 Stellen; numerische Prüfung und Intervall-Beweis sind für die gerundeten Daten berechnet.<\/p><ul><li><b>Intervall:<\/b> geschlossene Formeln. Gauß–Legendre: N = ⌈(n+1)/2⌉ Knoten, Nullstellen von P<sub>N<\/sub>. Gauß–Lobatto: N = ⌈(n+3)/2⌉, die Randpunkte und die Nullstellen von P′<sub>N−1<\/sub>. Clenshaw–Curtis: Tschebyscheff-Extrema cos(jπ/(N−1)). Äquidistant (Newton–Cotes): gleichmäßig verteilte Knoten mit Randpunkten. Bei den drei interpolatorischen Regeln stammen die Gewichte aus dem linearen System der Legendre-Momente bis Grad N−1; N ist die kleinste Knotenzahl, deren Regel den Grad n erreicht.<\/li><li><b>Dreieck und Tetraeder:<\/b> <code>kubatur.py<\/code> (Startknoten, Levenberg–Marquardt, Knotenentfernung) bis etwa Grad 20; danach Start aus der Regel des Vorgrads plus neue Knoten in den größten Lücken (<code>seed_tri2.py<\/code>, Zufallsstarts mit Seed 100+s). Dreieck Grad 25 (117 Knoten) stammt aus dieser Start-aus-Vorgrad-Suche.<\/li><li><b>Quadrat:<\/b> Grad 1 bis 20 mit <code>dom.py<\/code>/<code>cs.py<\/code> (Löser, Zentralsymmetrie), Grad 21 bis 30 mit <code>seed_sq.py<\/code> (gerade Grade, ohne Symmetrie, Start aus niedrigerem Grad) und <code>seed_cs.py<\/code> (ungerade Grade, zentralsymmetrisch: Paare ±p, ab Grad 9 unter dem Abzählwert). Zentralsymmetrie brachte bei geraden Graden keinen Gewinn.<\/li><li><b>PO:<\/b> dieselben Löser mit geweiteten Schranken (Dreieck: Duffy-Parameter in [−0,7; 1,7], Quadrat: Koordinaten in [−3, 3]), Gewichte ≥ 0 (<code>free_search.py<\/code>, <code>sqelim.py<\/code> mit Modus b). PO = PI, wo die Suche nichts Kleineres fand.<\/li><li><b>Würfel:<\/b> voll symmetrische Regeln (Gruppe Oh oder Td) aus <code>cubature_search.py<\/code> (Orbit-Typen, Symmetriereduktion, Nachbearbeitung), nachgerechnet mit <code>verify_rules.py<\/code>. Diese Regeln sind mit ‡ markiert; ihre numerische Prüfung und ihr Intervall-Beweis nutzen das symmetriereduzierte System (<code>cube_cert.py<\/code>, Aufruf <code>python run_cube_cert.py 2,10,14 a<\/code>).<\/li><li><b>Symmetriereduzierte und Schalen-Suchen bei höheren Graden:<\/b> C4-symmetrische Suchen auf dem Quadrat, A4/S4-Orbit- und rekursive Schalen-Suchen auf dem Tetraeder sowie Oh/Td-Symmetriereduktion auf dem Würfel erweitern den Atlas weit über Grad 20 hinaus.<\/li><\/ul><p><b>Reproduktion.<\/b> Alle Skripte stehen im Abschnitt Quelltext. Sie gehören in ein Verzeichnis mit dem Unterordner <code>lib/<\/code> (dort <code>cubature_atlas.py<\/code>). Pakete: numpy, scipy. Die Start-aus-Vorgrad-Skripte lesen Startregeln aus <code>allrules30.json<\/code> (Format {\"rules\": {Gebiet: {Grad: {\"n\": Knotenzahl, \"pts\": [[Koordinaten…, Gewicht], …]}}}}); die Punktliste jeder Regel lässt sich in Abbildung A kopieren. Beispiele:<\/p><div class=\"formula\">python kubatur.py auto triangle 12 --time 600<br>python seed_tri2.py 25 2 117 20 120<br>python seed_sq.py 22 2 92 d 12 150<br>python seed_cs.py 21 81 d 8 100<br>python sqelim.py 30 b 80 1<br>python free_search.py triangle 14,18 20<\/div><p>Die Skripte schreiben Regeln als <code>.npy<\/code> (Spalten: Koordinaten, Gewicht) und speichern nur nach bestandenem Monomtest und numerischer Prüfung; der Intervall-Beweis folgt, bevor eine Regel in den Atlas kommt. <code>python kubatur.py check rule_triangle_d12_n34.npy<\/code> prüft eine Datei. Laufzeiten: Sekunden bis wenige Minuten je Versuch auf zwei Rechenkernen; die Zufallsstarts sind durch Seeds festgelegt, die Ergebnisse hängen aber von Bibliotheksversionen und Rundung ab. Die Zahlen der Seite sind obere Schranken für das wahre Minimum.<\/p><h3 id=\"e-figs\">Wie die Abbildungen entstehen<\/h3><p><b>Abbildung A:<\/b> Das tanzende Polynom ist eine Linearkombination der Legendre-Basis (Produkte im Quadrat, Würfel) bis Grad n mit zeitlich verschobenen Phasen, auf Maximum 1 normiert. Im Intervall zeigt die graue Fläche das Integral, die Balken zeigen Breite = Gewicht und Höhe = Polynomwert am Knoten. In 2D und 3D tragen die Knoten Säulen beziehungsweise Zellen: Die Zerlegung des Gebiets ist ein Potenzdiagramm (gewichtetes Voronoi-Diagramm), dessen Zellflächen durch Iteration (bis 300 Schritte, Schrittweite 0,4, 22 nächste Nachbarn) gleich den Gewichten gemacht werden; in 3D sind es einfache Voronoi-Zellen. Grün: Wert positiv, rot: negativ, orange: negatives Gewicht.<\/p><p><b>Abbildung C bis E:<\/b> Der Fehler ist relativ zum exakten Wert (analytisch oder Gauß-Referenz hoher Ordnung); die orange Linie ist die Rechengenauigkeit (siehe oben).<\/p><h3>Grenzen<\/h3><p>Die Knotenzahlen sind obere Schranken für das wahre Minimum. Dass keine kleinere Regel existiert, ist nur dort bewiesen, wo „gefunden“ und untere Schranke übereinstimmen. Höhere Grade werden mit fortschreitender Suche weiter verbessert und sind noch nicht ausgereizt. Das Gauß-Produkt ist im Diagramm zunächst ausgeblendet, weil es die Skala sprengt; die Legende schaltet es ein.<\/p><h3>Formelsammlungen<\/h3><p>Weitere Regeln, auch mit Symmetrie, Randknoten oder negativen Gewichten, stehen in der Enzyklopädie <a class=\"cite\" href=\"#r14\">[14]<\/a>, den Sammlungen <a class=\"cite\" href=\"#r32\">[32]<\/a><a class=\"cite\" href=\"#r33\">[33]<\/a> und in <a class=\"cite\" href=\"#r6\">[6]<\/a><a class=\"cite\" href=\"#r13\">[13]<\/a> (Dreieck). Die Sammlung <a class=\"cite\" href=\"#r32\">[32]<\/a> nennt allein 26 Quellen, darunter Lyness und Jespersen (1975), Papanicolopulos (2015, 2016), Taylor (2008), Vioreanu und Rokhlin (2014) sowie Williams et al. (2014).<\/p><\/div>\n"},"docStale":false,"refs":[{"n":1,"y":"1958","t":"J. Albrecht, L. Collatz: Zur numerischen Auswertung mehrdimensionaler Integrale. ZAMM 38 (1958), 1–15.","u":"https://doi.org/10.1002/zamm.19580380102"},{"n":2,"y":"1971","t":"A. H. Stroud: Approximate Calculation of Multiple Integrals. Prentice-Hall, Englewood Cliffs (1971). Positive interior rules for the square with 4, 7 and 12 points for the degrees 3, 5 and 7, as listed in Table 1 of [16]; for the cube 6 and 13 points for the degrees 3 and 5, as listed in Table 2 of [31].","u":"https://archive.org/details/approximatecalcu0000stro_b8j7/"},{"n":3,"y":"1976","t":"H. M. Möller: Kubaturformeln mit minimaler Knotenzahl. Numerische Mathematik 25 (1976), 185–200.","u":"https://doi.org/10.1007/BF01462272"},{"n":4,"y":"1979","t":"H. M. Möller: Lower bounds for the number of nodes in cubature formulae. In: G. Hämmerlin (ed.), Numerische Integration, ISNM 45, Birkhäuser, Basel (1979) 221–230.","u":"https://doi.org/10.1007/978-3-0348-6288-2_17"},{"n":5,"y":"1984","t":"A. Genz: Testing multidimensional integration routines. In: B. Ford, J. C. Rault, F. Thomasset (eds.), Tools, Methods, and Languages for Scientific and Engineering Computation. North-Holland (1984), 81–94. ISBN 0-444-87570-0.","u":"https://pe rees 10 (24 nodes, reflection symmetry), 30 (168 nodes, rotation symmetry), 50 (453 nodes, full symmetry) and the cube rule of degree 5 (13 nodes); generator nodes as printed (16 digits), expanded with the symmetry group; the printed weight of the 8th and 9th node of the cube rule is replaced by the value that satisfies the moment equations (see the rule file). Rules from the authors' published data tables, all nodes listed, weights scaled to the volume of the domain: fully symmetric triangle rules of the degrees 32 to 49 (without 34), rotationally symmetric triangle rules of the degrees 23, 28 and 29, square rules of the degrees 16, 20 and 22, tetrahedron rules of the degrees 11 to 15 and cube rules of the degrees 9, 11, 12, 13 and 15. The build re-checks the moment equations. Rules of the data tables of the authors that are more recent than the paper and have fewer nodes than the count of the paper (degree and number of nodes): triangle 19 (70), 23 (101), 24 (109), 25 (117), 31 (177), 31 (178), 32 (189), 32 (192), 33 (201), 34 (212), 34 (213), 35 (225), 36 (236), 36 (237), 37 (249), 38 (262), 38 (265), 39 (274), 39 (277), 40 (290), 40 (291), 41 (302), 41 (303), 42 (318), 43 (333), 44 (348), 45 (363), 46 (378), 47 (393), 48 (412), 48 (414), 49 (429), 50 (444); square 9 (17), 11 (24), 13 (33), 15 (43), 17 (54), 19 (67), 21 (81), 23 (96); tetra 9 (56), 12 (120), 12 (121), 13 (145), 15 (212); cube 9 (48), 10 (73), 11 (82), 12 (115), 13 (129), 14 (173), 15 (188).","de":"PI-Regeln aus der Literatur, zum Vergleich übernommen. Zusätzlich enthalten sind die asymmetrischen Dreiecksregeln der Grade 3–9 (4, 6, 7, 11, 12, 16 und 19 Knoten) aus der ursprünglichen Datendatei `triaarbq_table.txt` der Autoren; Knoten und Gewichte sind auf das Atlas-Referenzdreieck umgerechnet. H. Xiao, Z. Gimbutas: A numerical algorithm for the construction of efficient quadrature rules in two and higher dimensions. Comput. Math. Appl. 59 (2010). Regeln mit gedruckten Erzeugerknoten: Dreieck Grad (function(){
