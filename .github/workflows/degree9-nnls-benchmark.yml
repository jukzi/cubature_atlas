name: Degree-9 NNLS variable-projection benchmark

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - "code/benchmark_degree9_nnls.py"
      - ".github/workflows/degree9-nnls-benchmark.yml"

permissions:
  contents: read

jobs:
  paired-search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install search dependencies
        run: pip install numpy scipy
      - name: Run paired NNLS search campaign
        run: python code/benchmark_degree9_nnls.py
      - name: Upload candidate rules and measurements
        uses: actions/upload-artifact@v4
        with:
          name: degree9-nnls-projection-results
          path: degree9_nnls_projection_results.json
