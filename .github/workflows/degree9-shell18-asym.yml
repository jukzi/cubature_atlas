name: Degree-9 18-node shell search with asymmetric polish

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - "code/benchmark_degree9_shell18_asym.py"
      - ".github/workflows/degree9-shell18-asym.yml"

permissions:
  contents: read

jobs:
  shell-asymmetric-search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install search dependencies
        run: pip install numpy scipy
      - name: Run nested-shell starts with asymmetric LM polishing
        run: python code/benchmark_degree9_shell18_asym.py
      - name: Upload candidates and measurements
        uses: actions/upload-artifact@v4
        with:
          name: degree9-shell18-asymmetric-results
          path: degree9_shell18_asym_results.json
