name: Unit tests

on:
  push:
    branches: [main]
    paths:
      - "code/tri_search.py"
      - "code/moeller_bound.py"
      - "code/triangle_moeller.py"
      - "tools/state_table.py"
      - "tools/sort_references.py"
      - "tests/**"
      - ".github/workflows/unit-tests.yml"
  pull_request:
    paths:
      - "code/tri_search.py"
      - "code/moeller_bound.py"
      - "code/triangle_moeller.py"
      - "tools/state_table.py"
      - "tools/sort_references.py"
      - "tests/**"
      - ".github/workflows/unit-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependencies
        run: pip install numpy scipy
      - name: Run unit tests
        run: python -m unittest discover --start-directory tests --pattern 'test_*.py' --verbose
