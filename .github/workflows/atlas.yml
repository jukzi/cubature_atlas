name: Cubature Atlas

# Pull requests: verify all rules, build the site, attach it as an artifact and
# publish a live preview under https://jukzi.github.io/cubature_atlas/pr-preview/pr-<number>/
# (the link is posted as a comment in the pull request; the preview is removed when
# the pull request is closed or merged).
# Pushes to main: build the site in an unlocked job, then deploy atomically to the root of
# the gh-pages branch (keeping pr-preview/). Per-PR and main concurrency groups serialize
# writes without letting one pull request cancel another; short fresh-worktree retries handle
# any remaining cross-PR push collisions.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Verify rules and build the preview
        run: python tools/build_atlas.py --base origin/${{ github.base_ref }}
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: site

  preview:
    # Pull requests from forks get no write token, so they keep only the artifact.
    # Per-PR concurrency serializes deploy/remove for the same PR without cancelling other PRs.
    needs: check
    if: github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: gh-pages-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Is this still the head commit of the pull request?
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }} --jq .head.sha)
          if [ "$current" = "${{ github.event.pull_request.head.sha }}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "A newer commit exists; its run publishes the preview."
          fi
      - uses: actions/download-artifact@v4
        if: steps.head.outputs.current == 'true'
        with:
          name: site-preview
          path: site
      - name: Publish the live preview (attempt 1)
        id: p1
        if: steps.head.outputs.current == 'true'
        continue-on-error: true
        uses: rossjrw/pr-preview-action@v1.8.2
        with:
          source-dir: site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          qr-code: false
          action: deploy
      - name: Clean up and wait before retry
        if: steps.p1.outcome == 'failure'
        run: |
          git rebase --abort || true
          git merge --abort || true
          git reset --hard HEAD || true
          git worktree prune || true
          rm -rf github-pages-deploy-action-temp-deployment-folder
          sleep $((RANDOM % 25 + 10))
      - name: Publish the live preview (attempt 2)
        if: steps.p1.outcome == 'failure'
        uses: rossjrw/pr-preview-action@v1.8.2
        with:
          source-dir: site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          qr-code: false
          action: deploy

  remove-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: gh-pages-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove the live preview (attempt 1)
        id: r1
        continue-on-error: true
        uses: rossjrw/pr-preview-action@v1.8.2
        with:
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: remove
      - name: Clean up and wait before retry
        if: steps.r1.outcome == 'failure'
        run: |
          git rebase --abort || true
          git merge --abort || true
          git reset --hard HEAD || true
          git worktree prune || true
          rm -rf github-pages-deploy-action-temp-deployment-folder
          sleep $((RANDOM % 25 + 10))
      - name: Remove the live preview (attempt 2)
        if: steps.r1.outcome == 'failure'
        uses: rossjrw/pr-preview-action@v1.8.2
        with:
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: remove

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Verify rules and build the site
        run: python tools/build_atlas.py
      - name: Disable Jekyll processing on GitHub Pages
        run: touch site/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: site-main
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    concurrency:
      group: gh-pages-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site-main
          path: site
      - name: Deploy to the gh-pages branch (keeping pr-preview/)
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d "${RUNNER_TEMP:-/tmp}/gh-pages.XXXXXX")"
          cleanup() {
            git worktree remove --force "$work" 2>/dev/null || true
            rm -rf -- "$work"
            git worktree prune 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in 1 2 3 4; do
            cleanup
            git fetch --no-tags --depth=1 origin gh-pages
            git worktree add --detach "$work" FETCH_HEAD
            find "$work" -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'pr-preview' -exec rm -rf -- {} +
            cp -a site/. "$work/"
            git -C "$work" add -A
            if git -C "$work" diff --cached --quiet; then
              echo "No site changes to deploy."
              exit 0
            fi
            git -C "$work" \
              -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Deploy site (${GITHUB_SHA::7})"
            if git -C "$work" push origin HEAD:gh-pages; then
              echo "Deployed to gh-pages on attempt $attempt."
              exit 0
            fi
            echo "Push to gh-pages rejected on attempt $attempt (concurrent update); retrying..."
            sleep $((RANDOM % 15 + 5))
          done
          echo "Failed to push to gh-pages after 4 attempts." >&2
          exit 1
