name: Cubature Atlas

# Pull requests: verify all rules, build the site, attach it as an artifact and
# publish a live preview under https://jukzi.github.io/cubature_atlas/pr-preview/pr-<number>/
# (the link is posted as a comment in the pull request; the preview is removed when
# the pull request is closed or merged).
# Pushes to main: build the site and deploy it to the root of the gh-pages branch,
# keeping the pr-preview/ folder. GitHub Pages serves the gh-pages branch.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    concurrency:
      group: check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Verify rules and build the preview
        run: |
          # every rule needs an interval proof: prove all rules whose numbers have no recorded proof yet
          python tools/verify_rigorous.py --strict --missing reports/interval_proofs.json --merge reports/interval_proofs.json
          python tools/build_atlas.py --base origin/${{ github.base_ref }}
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: site

  preview:
    # Pull requests from forks get no write token, so they keep only the artifact.
    needs: check
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site-preview
          path: site
      - name: Publish the live preview
        uses: rossjrw/pr-preview-action@v1.8.2
        with:
          source-dir: site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: deploy

  remove-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Remove the live preview
        uses: rossjrw/pr-preview-action@v1.8.2
        with:
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: remove

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Verify rules and build the site
        run: |
          # every rule needs an interval proof: prove all rules whose numbers have no recorded proof yet
          python tools/verify_rigorous.py --strict --missing reports/interval_proofs.json --merge reports/interval_proofs.json
          python tools/build_atlas.py
      - name: Disable Jekyll processing on GitHub Pages
        run: touch site/.nojekyll
      - name: Deploy to the gh-pages branch (previews are kept)
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          folder: site
          branch: gh-pages
          clean-exclude: pr-preview
          force: false
