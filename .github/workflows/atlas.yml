name: Cubature Atlas

# No run is cancelled by another run (a cancelled run is shown as an error): there is no concurrency
# group; writes to gh-pages are repeated when two runs collide.
# Pull requests: verify all rules, build the site, attach it as an artifact and
# publish a live preview under https://jukzi.github.io/cubature_atlas/pr-preview/pr-<number>/
# (the link is posted as a comment in the pull request; the preview is removed when
# the pull request is closed or merged).
# Pushes to main: build the site and deploy it to the root of the gh-pages branch,
# keeping the pr-preview/ folder. GitHub Pages serves the gh-pages branch.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Verify rules and build the preview
        run: |
          # every rule needs an interval proof: prove all rules whose numbers have no recorded proof yet
          python tools/verify_rigorous.py --strict --missing --save
          python tools/build_atlas.py --base origin/${{ github.base_ref }}
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: site

  preview:
    # Pull requests from forks get no write token, so they keep only the artifact.
    # No concurrency group: GitHub cancels a pending run of a group when a newer one arrives, and a
    # cancelled run is shown as an error. Instead the publishing step is repeated if two runs push to
    # gh-pages at the same time (the push is then rejected), and a run whose commit is no longer the
    # head of the pull request publishes nothing (the newer run publishes).
    needs: check
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Is this still the head commit of the pull request?
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }} --jq .head.sha)
          if [ "$current" = "${{ github.event.pull_request.head.sha }}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "A newer commit exists; its run publishes the preview."
          fi
      - uses: actions/download-artifact@v4
        if: steps.head.outputs.current == 'true'
        with:
          name: site-preview
          path: site
      - name: Publish the live preview (attempt 1)
        id: p1
        if: steps.head.outputs.current == 'true'
        continue-on-error: true
        uses: rossjrw/pr-preview-action@v1.8.2
        with:
          source-dir: site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          qr-code: false
          action: deploy
      - name: Wait before the next attempt
        if: steps.p1.outcome == 'failure'
        run: sleep $((RANDOM % 30 + 15))
      - name: Publish the live preview (attempt 2)
        id: p2
        if: steps.p1.outcome == 'failure'
        continue-on-error: true
        uses: rossjrw/pr-preview-action@v1.8.2
        with:
          source-dir: site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          qr-code: false
          action: deploy
      - name: Wait before the last attempt
        if: steps.p2.outcome == 'failure'
        run: sleep $((RANDOM % 60 + 30))
      - name: Publish the live preview (attempt 3)
        if: steps.p2.outcome == 'failure'
        uses: rossjrw/pr-preview-action@v1.8.2
        with:
          source-dir: site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          qr-code: false
          action: deploy

  remove-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove the live preview (attempt 1)
        id: r1
        continue-on-error: true
        uses: rossjrw/pr-preview-action@v1.8.2
        with:
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: remove
      - name: Wait before the next attempt
        if: steps.r1.outcome == 'failure'
        run: sleep $((RANDOM % 30 + 15))
      - name: Remove the live preview (attempt 2)
        id: r2
        if: steps.r1.outcome == 'failure'
        continue-on-error: true
        uses: rossjrw/pr-preview-action@v1.8.2
        with:
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: remove
      - name: Wait before the last attempt
        if: steps.r2.outcome == 'failure'
        run: sleep $((RANDOM % 60 + 30))
      - name: Remove the live preview (attempt 3)
        if: steps.r2.outcome == 'failure'
        uses: rossjrw/pr-preview-action@v1.8.2
        with:
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: remove

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Verify rules and build the site
        run: |
          # every rule needs an interval proof: prove all rules whose numbers have no recorded proof yet
          python tools/verify_rigorous.py --strict --missing --save
          python tools/build_atlas.py
      - name: Disable Jekyll processing on GitHub Pages
        run: touch site/.nojekyll
      - name: Deploy to the gh-pages branch (previews are kept), attempt 1
        id: d1
        continue-on-error: true
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          folder: site
          branch: gh-pages
          clean-exclude: pr-preview
          force: false
      - name: Wait before the next attempt
        if: steps.d1.outcome == 'failure'
        run: sleep $((RANDOM % 30 + 15))
      - name: Deploy to the gh-pages branch, attempt 2
        id: d2
        if: steps.d1.outcome == 'failure'
        continue-on-error: true
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          folder: site
          branch: gh-pages
          clean-exclude: pr-preview
          force: false
      - name: Wait before the last attempt
        if: steps.d2.outcome == 'failure'
        run: sleep $((RANDOM % 60 + 30))
      - name: Deploy to the gh-pages branch, attempt 3
        if: steps.d2.outcome == 'failure'
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          folder: site
          branch: gh-pages
          clean-exclude: pr-preview
          force: false
