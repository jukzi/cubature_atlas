name: Degree-9 C3 orbit elimination from higher-degree rules

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - "code/benchmark_degree9_c3_orbits.py"
      - ".github/workflows/degree9-c3-orbits.yml"

permissions:
  contents: read

jobs:
  orbit-search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install search dependencies
        run: pip install numpy scipy
      - name: Run C3 orbit elimination campaign
        run: python code/benchmark_degree9_c3_orbits.py
      - name: Upload candidates and measurements
        uses: actions/upload-artifact@v4
        with:
          name: degree9-c3-orbit-elimination-results
          path: degree9_c3_orbit_elimination_results.json
