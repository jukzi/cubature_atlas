name: Degree-9 mirror-symmetric searches for 18 and 17 PI nodes

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - "code/benchmark_degree9_mirror_18_17.py"
      - ".github/workflows/degree9-mirror-18-17.yml"

permissions:
  contents: read

jobs:
  mirror-search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install search dependencies
        run: pip install numpy scipy
      - name: Run mirror and asymmetric paired searches
        run: python code/benchmark_degree9_mirror_18_17.py
      - name: Upload candidate rules and measurements
        uses: actions/upload-artifact@v4
        with:
          name: degree9-mirror-18-17-results
          path: degree9_mirror_18_17_results.json
