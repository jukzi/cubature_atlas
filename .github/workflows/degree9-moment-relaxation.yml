name: Degree-9 moment-matrix rank relaxation

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - "code/benchmark_degree9_moment_relaxation.py"
      - ".github/workflows/degree9-moment-relaxation.yml"

permissions:
  contents: read

jobs:
  relaxation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependencies
        run: pip install numpy scipy
      - name: Test PSD moment-matrix rank relaxations
        run: python code/benchmark_degree9_moment_relaxation.py
      - name: Upload relaxation factors and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: degree9-moment-relaxation
          path: degree9_moment_relaxation.json
