name: Interval proofs

# Rigorous check of the rules with interval arithmetic (tools/verify_rigorous.py):
#  part 1 encloses the moment residual of the stored decimal numbers and checks nodes and weights exactly,
#  part 2 proves with a Krawczyk test that an exact rule with the stored quality exists near the stored numbers.
# Pull requests: the rule files added or changed against the base branch (all rules if the checker itself
# changed). The job fails if the stored numbers do not pass, or if the existence proof fails for a rule
# without "status": "needs_certificate".
# Weekly and on demand: all rules; the report is attached as an artifact. If the result differs from
# reports/interval_proofs.json (new, changed or removed rule files, or a different verdict), the job opens
# or updates a pull request with the new report from the branch auto/interval-report.

on:
  pull_request:
    paths:
      - "rules/**"
      - "tools/verify_rigorous.py"
      - ".github/workflows/rigorous.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTO_SEARCH_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Changed rules (pull request)
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet origin/${{ github.base_ref }} -- tools/verify_rigorous.py; then
            python tools/verify_rigorous.py --changed origin/${{ github.base_ref }} --strict --report interval_proofs.json --summary "$GITHUB_STEP_SUMMARY"
          else
            python tools/verify_rigorous.py --report interval_proofs.json --summary "$GITHUB_STEP_SUMMARY"
          fi
      - name: All rules
        if: github.event_name != 'pull_request'
        run: python tools/verify_rigorous.py --report interval_proofs.json --update reports/interval_proofs.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Pull request with the updated report
        if: github.event_name != 'pull_request'
        permissions:
          contents: write
          pull-requests: write
        env:
          GH_TOKEN: ${{ secrets.AUTO_SEARCH_TOKEN || github.token }}
        run: |
          if git diff --quiet -- reports/interval_proofs.json; then
            echo "report unchanged, nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B auto/interval-report
          git add reports/interval_proofs.json
          git commit -m "Update the interval proof report" -m "Full run of tools/verify_rigorous.py, workflow run ${{ github.run_id }}."
          git push --force origin auto/interval-report
          if [ -z "$(gh pr list --head auto/interval-report --state open --json number --jq '.[].number')" ]; then
            {
              echo "Automatic update of \`reports/interval_proofs.json\` after a full run of \`tools/verify_rigorous.py\` (workflow run ${{ github.run_id }})."
              echo
              echo "The report changed: new, changed or removed rule files, or a different verdict. The website shows the result of every rule whose file matches the hash in the report. The job summary of the run lists every rule."
            } > /tmp/pr_body.md
            gh pr create --base main --head auto/interval-report --title "Update the interval proof report" --body-file /tmp/pr_body.md
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interval-proofs
          path: interval_proofs.json
