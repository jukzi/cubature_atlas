name: Degree-9 18-node nested-shell PI search

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - "code/benchmark_degree9_shell18.py"
      - ".github/workflows/degree9-shell18-search.yml"

permissions:
  contents: read

jobs:
  shell-search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install search dependencies
        run: pip install numpy scipy
      - name: Run independent nested-shell search
        run: python code/benchmark_degree9_shell18.py
      - name: Upload candidates and measurements
        uses: actions/upload-artifact@v4
        with:
          name: degree9-shell18-search-results
          path: degree9_shell18_results.json
