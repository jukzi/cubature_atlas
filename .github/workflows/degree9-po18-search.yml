name: Degree-9 physical PO search at 18 nodes

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - "code/benchmark_degree9_po18.py"
      - ".github/workflows/degree9-po18-search.yml"

permissions:
  contents: read

jobs:
  paired-search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install search dependencies
        run: pip install numpy scipy
      - name: Run paired PI/PO physical search
        run: python code/benchmark_degree9_po18.py
      - name: Upload candidates and measurements
        uses: actions/upload-artifact@v4
        with:
          name: degree9-po18-physical-results
          path: degree9_po18_physical_results.json
