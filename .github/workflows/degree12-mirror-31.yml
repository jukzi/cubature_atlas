name: Degree-12 mirror-symmetric PI32 to PI31 elimination

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - "code/benchmark_degree12_mirror_31.py"
      - ".github/workflows/degree12-mirror-31.yml"

permissions:
  contents: read

jobs:
  mirror-elimination:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install search dependencies
        run: pip install numpy scipy
      - name: Run mirror-symmetric PI32 to PI31 elimination campaign
        run: python code/benchmark_degree12_mirror_31.py
      - name: Upload candidates and measurements
        uses: actions/upload-artifact@v4
        with:
          name: degree12-mirror-31-results
          path: degree12_mirror_32_to_31_results.json
