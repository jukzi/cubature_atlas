name: Triangle LM paired benchmark

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - "code/tri_search.py"
      - "code/benchmark_tri_lm.py"
      - ".github/workflows/tri-lm-benchmark.yml"

permissions:
  contents: read

jobs:
  paired-search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install search dependencies
        run: pip install numpy scipy
      - name: Run paired node-elimination campaign
        working-directory: .
        run: python code/benchmark_tri_lm.py
      - name: Upload candidates and measurements
        uses: actions/upload-artifact@v4
        with:
          name: triangle-lm-paired-benchmark
          path: tri_lm_benchmark_results.json
